<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>三眼仔飞行棋</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  /* Deep-space palette (unified) */
  --bg-deep:#0A1130; --bg-surface:#141F4A; --bg-elevated:#1B2960;
  --border-soft:rgba(167,139,250,0.18); --border-hard:rgba(167,139,250,0.35);
  --text-hi:#F0F4FF; --text-mid:#B8C4E8; --text-low:#7885B5;
  --brand-yellow:#FFD53D; --brand-yellow-dark:#F5A623; --brand-yellow-light:#FFE066;
  --brand-purple:#A78BFA;
  --success:#4ADE80; --warning:#FB923C; --danger:#F87171;
  /* Player colors: main / dark (stroke) / light (highlight) */
  --p0:#EF4444; --p0d:#B91C1C; --p0l:#FCA5A5;
  --p1:#F59E0B; --p1d:#B45309; --p1l:#FDE68A;
  --p2:#3B82F6; --p2d:#1E40AF; --p2l:#93C5FD;
  --p3:#22C55E; --p3d:#15803D; --p3l:#86EFAC;
  /* Radius scale */
  --r-sm:12px; --r-md:16px; --r-lg:20px;
  /* Shadow tokens */
  --sh-1:0 2px 8px rgba(0,0,0,0.3);
  --sh-2:0 6px 24px rgba(0,0,0,0.4);
  --sh-3:0 12px 40px rgba(0,0,0,0.5);
  /* Legacy aliases (kept for backward-compat of unmigrated selectors) */
  --sky:var(--bg-deep); --card:rgba(255,255,255,0.05); --border:var(--border-soft);
  --radius:var(--r-md); --yellow:var(--brand-yellow); --green:var(--p3); --blue:var(--brand-purple);
  --text:var(--text-hi); --text-dim:var(--text-mid);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:'Nunito',sans-serif;background:var(--sky);color:var(--text);overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 100% 55% at 50% 0%,#1a2360 0%,transparent 65%),
  radial-gradient(ellipse 50% 40% at 85% 90%,rgba(167,139,250,0.22) 0%,transparent 55%);}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:0.75rem;
  display:flex;flex-direction:column;gap:0.75rem;min-height:100vh}

nav{display:flex;align-items:center;justify-content:space-between;padding:0.6rem 1rem;
  background:rgba(10,17,48,0.9);border:1px solid rgba(167,139,250,0.25);
  border-radius:var(--radius);backdrop-filter:blur(12px)}
.logo{display:flex;align-items:center;gap:8px;font-family:'Fredoka One',cursive;font-size:20px;color:var(--yellow)}
.logo img{width:40px;height:30px;object-fit:cover;border-radius:6px}
.nav-links{display:flex;gap:6px}
.nav-btn{background:transparent;border:1px solid rgba(255,255,255,0.12);border-radius:var(--r-sm);
  padding:6px 14px;font-size:13px;font-weight:700;color:var(--text-dim);cursor:pointer;font-family:inherit;transition:all 0.2s}
.nav-btn:hover,.nav-btn.active{background:rgba(167,139,250,0.2);border-color:var(--blue);color:#FFD53D}

.screen{display:none;flex-direction:column;gap:0.75rem;animation:fadeUp 0.2s ease}
.screen.active{display:flex}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* HOME */
.hero{text-align:center;padding:1rem 0.5rem;display:flex;flex-direction:column;align-items:center;gap:1rem}
.hero-img{max-width:min(360px,80vw);height:auto;filter:drop-shadow(0 8px 24px rgba(0,0,0,0.3));animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hero h1{font-family:'Fredoka One',cursive;font-size:clamp(26px,6vw,40px);
  background:linear-gradient(135deg,var(--yellow),var(--green));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-feats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.feat{padding:5px 12px;border-radius:20px;background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);font-size:12px;font-weight:700;color:var(--text-dim)}
.home-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* RULES */
.rules-card{background:rgba(10,17,48,0.8);border:1px solid rgba(167,139,250,0.15);border-radius:var(--radius);padding:1rem 1.25rem}
.rules-title{font-family:'Fredoka One',cursive;font-size:15px;color:var(--yellow);margin-bottom:0.6rem}
.rules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.rule-item{display:flex;gap:8px;align-items:flex-start;font-size:12px}
.rule-icon{font-size:18px;flex-shrink:0}
.rule-text strong{display:block;font-size:13px;font-weight:800;margin-bottom:1px}
.rule-text span{color:var(--text-dim)}

/* BUTTONS */
.btn-primary{background:linear-gradient(160deg,var(--brand-yellow-light),var(--brand-yellow) 45%,var(--brand-yellow-dark));color:#3a2100;border:none;
  border-radius:var(--r-sm);padding:12px 28px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;
  transition:all 0.2s;box-shadow:0 4px 14px rgba(255,213,61,0.4),inset 0 2px 0 rgba(255,255,255,0.55),inset 0 -2px 0 rgba(0,0,0,0.12);letter-spacing:0.3px}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(255,213,61,0.55),inset 0 2px 0 rgba(255,255,255,0.55),inset 0 -2px 0 rgba(0,0,0,0.12)}
.btn-ghost{background:rgba(167,139,250,0.08);color:var(--text-hi);border:1.5px solid rgba(167,139,250,0.35);
  border-radius:var(--r-sm);padding:11px 22px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:all 0.2s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.06)}
.btn-ghost:hover{background:rgba(167,139,250,0.16);border-color:rgba(167,139,250,0.55)}
.btn-sm{padding:7px 16px;font-size:13px}

/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(3,8,24,0.85);display:flex;align-items:center;
  justify-content:center;z-index:100;backdrop-filter:blur(8px)}
.overlay.hidden{display:none}
.modal{background:linear-gradient(160deg,var(--bg-elevated),var(--bg-deep));border:1px solid rgba(167,139,250,0.3);
  border-radius:var(--radius);padding:1.75rem;width:min(400px,94vw);display:flex;flex-direction:column;gap:1rem;
  box-shadow:0 0 40px rgba(167,139,250,0.15);max-height:90vh;overflow-y:auto}
.modal h2{font-family:'Fredoka One',cursive;font-size:20px;color:var(--yellow)}
.input-field{background:rgba(255,255,255,0.06);border:1px solid rgba(167,139,250,0.3);
  border-radius:var(--r-sm);padding:10px 14px;color:var(--text);font-size:15px;font-family:inherit;
  width:100%;outline:none;transition:border-color 0.2s}
.input-field:focus{border-color:var(--brand-yellow)}
.select-field{background:rgba(255,255,255,0.06);border:1px solid rgba(167,139,250,0.3);
  border-radius:var(--r-sm);padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit;width:100%;outline:none}
.select-field option{background-color:var(--bg-surface);color:#ffffff;}
.form-label{font-size:13px;font-weight:700;color:var(--text-dim);margin-bottom:4px;display:block}
.form-group{display:flex;flex-direction:column;gap:4px}
.modal-btns{display:flex;gap:8px}

/* AVATAR PICKER */
.avatar-grid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.avatar-opt{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:6px;border-radius:12px;border:2px solid rgba(255,255,255,0.1);
  background:transparent;transition:all 0.15s;width:70px}
.avatar-opt:hover{border-color:rgba(255,255,255,0.3)}
.avatar-opt.selected{border-color:var(--yellow);background:rgba(255,209,70,0.12)}
.avatar-opt img{width:50px;height:50px;object-fit:contain}
.avatar-opt span{font-size:9px;font-weight:700;color:var(--text-dim);text-align:center;line-height:1.2}
.color-opts{display:flex;gap:10px;justify-content:center}
.color-opt{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all 0.15s}
.color-opt.selected{border-color:#fff;transform:scale(1.2);box-shadow:0 0 8px rgba(255,255,255,0.4)}

/* LOBBY */
.section-header{display:flex;align-items:center;justify-content:space-between}
.section-title{font-family:'Fredoka One',cursive;font-size:18px;color:var(--yellow)}
.rooms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.room-card{background:linear-gradient(155deg,rgba(27,41,96,0.88),rgba(20,31,74,0.82));
  border:1px solid var(--border-soft);border-radius:var(--r-md);padding:1rem;cursor:pointer;
  transition:transform 0.2s,border-color 0.2s,box-shadow 0.2s;position:relative;
  box-shadow:var(--sh-1),inset 0 1px 0 rgba(255,255,255,0.05)}
.room-card:hover{border-color:var(--border-hard);transform:translateY(-2px);box-shadow:var(--sh-2)}
.room-progress{margin-top:6px;height:5px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
.room-progress-fill{height:100%;background:linear-gradient(90deg,var(--p3),var(--brand-yellow));transition:width 0.3s;border-radius:3px}
.room-del-btn{position:absolute;top:6px;right:6px;background:rgba(239,68,68,0.75);color:#fff;
  border:none;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;line-height:1;transition:background 0.2s}
.room-del-btn:hover{background:var(--danger)}
.room-name{font-size:14px;font-weight:800}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:rgba(167,139,250,0.2);color:#FFD53D}
.room-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.room-meta{font-size:12px;color:var(--text-dim);margin-bottom:8px}
.room-avatars{display:flex;gap:4px}
.create-card{background:rgba(10,17,48,0.5);border:2px dashed rgba(167,139,250,0.2);
  border-radius:var(--radius);padding:1rem;cursor:pointer;transition:all 0.2s;
  display:flex;align-items:center;justify-content:center;gap:8px;min-height:100px;
  color:var(--text-dim);font-size:14px;font-weight:700}
.create-card:hover{background:rgba(167,139,250,0.06);border-color:rgba(167,139,250,0.4);color:#FFD53D}

/* GAME */
.room-code-bar{display:flex;align-items:center;justify-content:space-between;
  background:rgba(167,139,250,0.15);border:1px solid rgba(167,139,250,0.3);
  border-radius:var(--r-sm);padding:7px 14px;font-size:13px}
.room-code-val{font-family:'Space Mono',monospace;font-weight:700;color:#A78BFA;letter-spacing:3px}
.copy-btn{background:rgba(167,139,250,0.12);border:1px solid rgba(167,139,250,0.3);
  border-radius:10px;padding:4px 10px;color:#A78BFA;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:background 0.2s}
.copy-btn:hover{background:rgba(167,139,250,0.22)}
.board-area{display:flex;flex-direction:column;align-items:center;gap:0.75rem}
.board-container{position:relative;width:100%;max-width:500px;margin:0 auto}
#ludo-board{width:100%;height:auto;display:block;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,0.5);cursor:pointer}

/* DICE */
.dice-area{display:flex;align-items:center;justify-content:center;gap:1rem;
  background:rgba(10,17,48,0.8);border:1px solid rgba(167,139,250,0.2);
  border-radius:var(--radius);padding:0.8rem 1.2rem;width:100%;max-width:500px}
.dice{width:64px;height:64px;background:linear-gradient(160deg,#ffffff,#f0e8d8);
  border-radius:14px;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s,border-color 0.3s;
  box-shadow:0 6px 16px rgba(0,0,0,0.5),inset 0 -3px 6px rgba(0,0,0,0.08),inset 0 3px 6px rgba(255,255,255,0.9);
  user-select:none;border:3px solid #333;padding:0;overflow:visible;position:relative}
.dice svg{width:100%;height:100%;display:block;pointer-events:none}
.dice:hover:not(.disabled){transform:scale(1.08) rotate(-4deg)}
.dice.disabled{opacity:0.4;cursor:not-allowed}
.dice.rolling{animation:diceRoll 0.5s ease}
@keyframes diceRoll{0%{transform:rotate(0)}25%{transform:rotate(-24deg) scale(1.12)}75%{transform:rotate(18deg) scale(1.16)}100%{transform:rotate(0) scale(1)}}
.dice.settle{animation:diceSettle 0.35s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes diceSettle{0%{transform:scale(1.18)}60%{transform:scale(0.92)}100%{transform:scale(1)}}
.dice.my-turn{animation:diceRing 1.2s ease-in-out infinite}
@keyframes diceRing{0%,100%{box-shadow:0 0 0 0 rgba(255,213,61,0.75),0 6px 16px rgba(0,0,0,0.5),inset 0 -3px 6px rgba(0,0,0,0.08),inset 0 3px 6px rgba(255,255,255,0.9)}50%{box-shadow:0 0 0 12px rgba(255,213,61,0),0 6px 16px rgba(0,0,0,0.5),inset 0 -3px 6px rgba(0,0,0,0.08),inset 0 3px 6px rgba(255,255,255,0.9)}}
.eat-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(230,57,70,0.92);color:#fff;font-family:'Fredoka One',cursive;
  font-size:22px;padding:12px 28px;border-radius:20px;z-index:600;
  animation:eatPopIn 1.5s ease forwards;pointer-events:none;white-space:nowrap}
@keyframes eatPopIn{0%{opacity:0;transform:translate(-50%,-50%) scale(0.3)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(0.8)}}
@keyframes bannerFlash{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.7;transform:scale(1.04)}}
.banner-pulse{animation:bannerFlash 0.9s ease-in-out infinite}
/* Brief 700ms scale pop when local player's turn STARTS */
@keyframes bannerTurnAttn{0%{transform:scale(1)}30%{transform:scale(1.14)}100%{transform:scale(1)}}
.banner-turn-attn{animation:bannerTurnAttn 0.7s ease-out}

/* Piece landing ripple (走棋每步落地) */
@keyframes pieceRipple{
  0%{width:16px;height:16px;opacity:0.9}
  100%{width:56px;height:56px;opacity:0}
}
/* Eat-burst radial rays fade+scale */
@keyframes eatBurst{
  0%{transform:scale(0.3) rotate(0);opacity:0}
  25%{transform:scale(1.15) rotate(15deg);opacity:1}
  100%{transform:scale(1.6) rotate(45deg);opacity:0}
}
/* Board shake on eat impact */
@keyframes boardShake{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-3px,2px)}
  40%{transform:translate(3px,-2px)}
  60%{transform:translate(-2px,-1px)}
  80%{transform:translate(2px,1px)}
}
/* Safe-zone hexagonal shield expansion */
@keyframes safeShield{
  0%{transform:translate(-50%,-50%) scale(0.3);opacity:0}
  30%{transform:translate(-50%,-50%) scale(1.15);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1.4);opacity:0}
}

/* PLAYERS PANEL */
.players-panel{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%;max-width:500px}
.player-card{background:rgba(10,17,48,0.8);border:2px solid rgba(255,255,255,0.08);
  border-radius:var(--r-sm);padding:0.6rem 0.8rem;display:flex;align-items:center;gap:8px;transition:transform 0.3s,border-color 0.3s,box-shadow 0.3s;position:relative}
.player-card.current-turn{transform:translateY(-1px);animation:cardGlow 1.8s ease-in-out infinite}
@keyframes cardGlow{
  0%,100%{box-shadow:0 0 10px var(--pc-glow,#FFD53D)}
  50%{box-shadow:0 0 20px var(--pc-glow,#FFD53D),0 0 4px var(--pc-glow,#FFD53D)}
}
.player-name{font-weight:800;font-size:13px}
.player-status{font-size:11px;color:var(--text-dim)}
.piece-mini{width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(0,0,0,0.3);display:inline-block;box-shadow:inset 0 -2px 2px rgba(0,0,0,0.25),inset 0 1px 1px rgba(255,255,255,0.35)}
.pieces-row{display:flex;gap:3px;flex-wrap:wrap}

/* GAME LOG */
.game-log{background:rgba(10,17,48,0.7);border:1px solid rgba(167,139,250,0.15);
  border-radius:12px;padding:0.6rem 0.8rem;max-height:90px;overflow-y:auto;
  font-size:12px;width:100%;max-width:500px}
.log-entry{padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.05);color:var(--text-dim)}
.log-entry:last-child{border-bottom:none;color:var(--text)}

/* END */
.end-overlay{position:fixed;inset:0;background:rgba(3,8,24,0.9);display:flex;align-items:center;
  justify-content:center;z-index:50;backdrop-filter:blur(10px)}
.end-overlay.hidden{display:none}
.end-box{background:linear-gradient(160deg,var(--bg-elevated),var(--bg-deep));border:1px solid rgba(167,139,250,0.3);
  border-radius:var(--radius);padding:2rem;text-align:center;max-width:320px;width:92%;
  display:flex;flex-direction:column;gap:0.75rem;align-items:center}
.end-box h2{font-family:'Fredoka One',cursive;font-size:26px;color:var(--yellow)}


/* ── ALIEN EFFECTS ── */

/* 投骰子时三眼仔欢呼 */
.dice-alien-cheer {
  position:fixed;bottom:120px;left:50%;transform:translateX(-50%);
  z-index:500;pointer-events:none;
  animation:alienCheer 0.8s ease forwards;
}
@keyframes alienCheer {
  0%{transform:translateX(-50%) translateY(60px) scale(0.5);opacity:0}
  40%{transform:translateX(-50%) translateY(-20px) scale(1.15);opacity:1}
  70%{transform:translateX(-50%) translateY(0) scale(1);opacity:1}
  100%{transform:translateX(-50%) translateY(0) scale(1);opacity:0}
}

/* 棋子跳跃动画 */
@keyframes pieceJump {
  0%{transform:translateY(0) scale(1)}
  30%{transform:translateY(-18px) scale(1.2)}
  60%{transform:translateY(-8px) scale(1.1)}
  80%{transform:translateY(-2px) scale(1.05)}
  100%{transform:translateY(0) scale(1)}
}
.piece-jumping { animation: pieceJump 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }

/* 吃子特效：惊吓三眼仔弹出 */
.eat-effect {
  position:fixed;z-index:500;pointer-events:none;
  animation:eatPop 1.2s ease forwards;
}
@keyframes eatPop {
  0%{transform:scale(0) rotate(-20deg);opacity:0}
  20%{transform:scale(1.4) rotate(10deg);opacity:1}
  50%{transform:scale(1.1) rotate(-5deg);opacity:1}
  70%{transform:scale(1.2) rotate(0deg) translateY(-30px);opacity:1}
  100%{transform:scale(0.8) rotate(5deg) translateY(-80px);opacity:0}
}

/* 棋子被吃时惊吓小弹窗 */
.piece-scared {
  position:fixed;z-index:501;pointer-events:none;
  animation:scaredPop 1s ease forwards;
}
@keyframes scaredPop {
  0%{transform:scale(0);opacity:0}
  30%{transform:scale(1.3);opacity:1}
  60%{transform:scale(1) translateY(-20px);opacity:1}
  100%{transform:scale(0.5) translateY(-60px);opacity:0}
}

/* 胜利：三眼仔从天而降 */
.alien-rain {
  position:fixed;z-index:400;pointer-events:none;
  animation:alienRain linear forwards;
}
@keyframes alienRain {
  0%{transform:translateY(-120px) rotate(var(--rot)) scale(var(--sc));opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{transform:translateY(110vh) rotate(calc(var(--rot) + 360deg)) scale(var(--sc));opacity:0}
}

/* 胜利灯光放射 */
.victory-light {
  position:fixed;top:50%;left:50%;z-index:399;pointer-events:none;
  width:0;height:0;
  animation:victoryLight 2s ease forwards;
}
.victory-light::before {
  content:'';position:absolute;top:50%;left:50%;
  width:300vw;height:300vw;
  transform:translate(-50%,-50%);
  background:radial-gradient(ellipse at center, rgba(255,209,70,0.35) 0%, transparent 65%);
  animation:lightPulse 0.5s ease-out;
}
@keyframes lightPulse {
  0%{transform:translate(-50%,-50%) scale(0);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1);opacity:0}
}

/* 骰子滚动时的三眼仔表情 */
.dice-face-overlay {
  position:absolute;top:-55px;left:50%;transform:translateX(-50%);
  width:50px;height:50px;object-fit:contain;
  animation:faceBounc 0.3s ease infinite alternate;
  pointer-events:none;z-index:10;
}
@keyframes faceBounc {
  from{transform:translateX(-50%) translateY(0) scale(1)}
  to{transform:translateX(-50%) translateY(-6px) scale(1.1)}
}

/* 四角守护三眼仔 */
.corner-guardian {
  position:absolute;width:44px;height:44px;object-fit:contain;
  opacity:0.75;animation:guardPulse 2.5s ease-in-out infinite;
  pointer-events:none;z-index:5;
}
@keyframes guardPulse {
  0%,100%{transform:scale(1) rotate(0deg);opacity:0.7}
  50%{transform:scale(1.12) rotate(5deg);opacity:0.95}
}

/* The Claw 台词气泡 */
.claw-bubble {
  position:fixed;z-index:502;pointer-events:none;
  background:rgba(10,17,48,0.95);border:2px solid #FFD53D;
  border-radius:16px;padding:8px 16px;
  font-family:'Fredoka One',cursive;font-size:15px;color:#FFD53D;
  white-space:nowrap;
  animation:bubblePop 2.5s ease forwards;
}
.claw-bubble::after {
  content:'';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:10px solid transparent;
  border-right:10px solid transparent;border-top:12px solid #FFD53D;
}
@keyframes bubblePop {
  0%{transform:scale(0) translateY(20px);opacity:0}
  15%{transform:scale(1.1) translateY(0);opacity:1}
  70%{transform:scale(1) translateY(0);opacity:1}
  100%{transform:scale(0.8) translateY(-30px);opacity:0}
}

/* confetti 三眼仔版 */
.alien-confetti {
  position:fixed;z-index:450;pointer-events:none;
  animation:confettiFall linear forwards;
}
@keyframes confettiFall {
  0%{transform:translateY(-20px) rotate(0deg);opacity:1}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}
}

/* TOAST & FX */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,#1B2960,#141F4A);border:1px solid rgba(167,139,250,0.35);
  border-radius:24px;padding:9px 22px;font-size:14px;font-weight:700;color:var(--text);
  z-index:300;pointer-events:none;white-space:nowrap;
  animation:toastIn 0.2s ease,toastOut 0.3s 2.2s ease forwards}
@keyframes toastIn{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
@keyframes toastOut{to{transform:translateX(-50%) translateY(20px);opacity:0}}
.confetti{position:fixed;pointer-events:none;z-index:200;animation:cfFall linear forwards}
@keyframes cfFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(167,139,250,0.2);
  border-top-color:var(--blue);border-radius:50%;animation:spin 0.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* WAITING-FOR indicator (online turn banner with avatar) */
.wait-indicator{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--text-dim)}
.wait-indicator img{width:24px;height:24px;object-fit:contain;border-radius:50%;background:rgba(255,255,255,0.08)}
.wait-indicator .wait-dots{display:inline-flex;gap:2px;margin-left:2px}
.wait-indicator .wait-dots span{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:0.4;animation:waitPulse 1.2s ease-in-out infinite}
.wait-indicator .wait-dots span:nth-child(2){animation-delay:0.2s}
.wait-indicator .wait-dots span:nth-child(3){animation-delay:0.4s}
@keyframes waitPulse{0%,80%,100%{opacity:0.3;transform:scale(0.8)}40%{opacity:1;transform:scale(1.1)}}

/* CONNECTION status pill (shown only when unstable/recovered) */
.conn-pill{position:fixed;top:0.5rem;left:50%;transform:translateX(-50%);z-index:400;
  font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;
  background:rgba(10,17,48,0.95);border:1px solid rgba(251,146,60,0.5);color:var(--warning);
  backdrop-filter:blur(8px);pointer-events:none;transition:opacity 0.3s}
.conn-pill.ok{border-color:rgba(74,222,128,0.5);color:var(--success)}
.conn-pill.hidden{opacity:0;pointer-events:none}

/* MOBILE (≤640px) — collapse padding, upsize touch targets, board fills width */
@media (max-width:640px){
  #app{padding:0.5rem;gap:0.5rem;max-width:100%}
  nav{padding:0.5rem 0.6rem}
  .logo{font-size:16px;gap:6px}
  .logo img{width:32px;height:24px}
  .nav-links{gap:4px}
  .nav-btn{padding:9px 10px;font-size:12px;min-height:38px}

  /* HOME */
  .hero{padding:0.5rem 0.25rem;gap:0.75rem}
  .hero-img{max-width:min(240px,60vw)}
  .hero p{font-size:13px}
  .hero-feats{gap:6px}
  .feat{padding:4px 10px;font-size:11px}
  .home-btns{gap:8px;width:100%}
  .home-btns .btn-primary,.home-btns .btn-ghost{flex:1;min-width:0}

  /* BUTTONS — 44px touch targets */
  .btn-primary{padding:12px 20px;font-size:15px;min-height:46px}
  .btn-ghost{padding:11px 18px;font-size:14px;min-height:44px}
  .btn-sm{padding:10px 16px;font-size:13px;min-height:40px}

  /* RULES */
  .rules-card{padding:0.75rem 0.9rem}
  .rules-grid{grid-template-columns:1fr 1fr;gap:6px}
  .rule-item{font-size:11px}
  .rule-icon{font-size:16px}
  .rule-text strong{font-size:12px}

  /* LOBBY */
  .section-title{font-size:16px}
  .rooms-grid{grid-template-columns:1fr;gap:8px}
  .room-card{padding:0.75rem}
  .room-name{font-size:14px}
  .room-del-btn{width:30px;height:30px;font-size:14px;top:4px;right:4px}
  .create-card{min-height:70px;font-size:13px}

  /* SETUP MODAL */
  .modal{padding:1.1rem 1rem;gap:0.75rem;max-height:92vh}
  .modal h2{font-size:17px}
  .form-label{font-size:12px}
  .input-field,.select-field{padding:11px 12px;font-size:14px;min-height:44px}
  .color-opt{width:40px;height:40px}
  .avatar-opt{width:64px;padding:5px}
  .avatar-opt img{width:44px;height:44px}
  .avatar-opt span{font-size:9px}
  .modal-btns{flex-direction:column-reverse;gap:8px}
  .modal-btns .btn-primary,.modal-btns .btn-ghost{width:100%}

  /* GAME */
  .room-code-bar{padding:8px 10px;font-size:12px;flex-wrap:wrap;gap:6px}
  .room-code-val{letter-spacing:2px;font-size:13px}
  .copy-btn{padding:8px 12px;font-size:12px;min-height:36px}
  #turn-banner{padding:0.3rem;font-size:14px}
  .board-container{max-width:100%;padding:0}
  .corner-guardian{width:32px;height:32px}
  #guardian-0{top:-10px;left:-10px}
  #guardian-1{top:-10px;right:-10px}
  #guardian-2{bottom:-10px;right:-10px}
  #guardian-3{bottom:-10px;left:-10px}

  .dice-area{padding:0.6rem 0.8rem;gap:0.75rem;max-width:100%}
  .dice{width:56px;height:56px;font-size:30px;border-radius:12px}
  .dice-area>div:last-child{min-width:0;flex:1}
  #turn-info{font-size:13px}
  #dice-result{font-size:11px}
  #move-hint{font-size:11px}

  .players-panel{grid-template-columns:1fr 1fr;gap:6px;max-width:100%}
  .player-card{padding:0.5rem 0.6rem;gap:6px}
  .player-card img{width:28px !important;height:28px !important}
  .player-name{font-size:12px}
  .player-status{font-size:10px}

  .game-log{max-width:100%;max-height:70px;font-size:11px}

  /* Waiting room compact */
  #online-wait{padding:1rem 0.75rem !important;gap:0.75rem !important}
  #online-wait > div:nth-child(2)>div{width:60px !important}

  /* END overlay */
  .end-box{padding:1.25rem;gap:0.5rem}
  .end-box h2{font-size:22px}
  .end-box img{width:70px;height:70px}

  /* Alien effect fixed-positions — respect short viewports */
  .dice-alien-cheer{bottom:auto;top:30%;width:70px !important;height:70px !important}
  .claw-bubble{bottom:auto !important;top:20% !important;font-size:13px;padding:6px 12px}

  /* Reduce toast size */
  .toast{padding:8px 16px;font-size:13px;bottom:1rem}

  /* Wait indicator scale down */
  .wait-indicator{font-size:12px}
  .wait-indicator img{width:20px;height:20px}
}

/* Very narrow (≤370px) — squeeze further */
@media (max-width:370px){
  .nav-btn{padding:8px 6px;font-size:11px}
  .logo{font-size:14px}
  .logo img{width:26px;height:20px}
  .rules-grid{grid-template-columns:1fr}
  .home-btns{flex-direction:column}
  .home-btns .btn-primary,.home-btns .btn-ghost{width:100%}
  .dice{width:48px;height:48px;font-size:26px}
  .avatar-opt{width:58px}
  .avatar-opt img{width:40px;height:40px}
}
</style>
</head>
<body>
<canvas class="stars" id="stars"></canvas>
<div id="app">

<nav>
  <div class="logo"><img src="imgs/img_c9a3b691.png" alt="logo">    三眼仔飞行棋
  </div>
  <div class="nav-links">

    <button class="nav-btn" onclick="goLobby()">大厅</button>

  </div>
</nav>

<!-- HOME -->
<div id="screen-home" class="screen active">
  <div class="hero"><img class="hero-img" src="imgs/img_3e3220a9.png" alt="三眼仔飞行棋">    <h1>三眼仔飞行棋</h1>

      <div class="feat">🎲 标准飞行棋规则</div>
      <div class="feat">👾 2-4人联机/本地</div>

    </div>
    <div class="home-btns">
      <button class="btn-primary" onclick="openSetup('local')">本地对战 ✦</button>
      <button class="btn-ghost" onclick="openSetup('online')">联机对战</button>
    </div>
  </div>
</div>

<!-- RULES -->
<div id="screen-rules" class="screen">
  <div style="font-family:'Fredoka One',cursive;font-size:20px;color:var(--yellow)">📖 飞行棋规则</div>
  <div class="rules-card">
    <div class="rules-title">基本规则</div>
    <div class="rules-grid">
      <div class="rule-item"><div class="rule-icon">🎲</div><div class="rule-text"><strong>出基地</strong><span>掷到6才能让棋子出基地</span></div></div>
      <div class="rule-item"><div class="rule-icon">🚀</div><div class="rule-text"><strong>走棋</strong><span>掷几就走几步，可选任意棋子</span></div></div>
      <div class="rule-item"><div class="rule-icon">🎁</div><div class="rule-text"><strong>掷6奖励</strong><span>掷到6额外再掷一次</span></div></div>
      <div class="rule-item"><div class="rule-icon">💥</div><div class="rule-text"><strong>吃子</strong><span>踩到对方棋子，对方回基地</span></div></div>
      <div class="rule-item"><div class="rule-icon">🛡️</div><div class="rule-text"><strong>安全格★</strong><span>星星格上的棋子不能被吃</span></div></div>
      <div class="rule-item"><div class="rule-icon">🏆</div><div class="rule-text"><strong>胜利</strong><span>4颗棋子全到终点获胜</span></div></div>
    </div>
  </div>
  <button class="btn-primary" onclick="openSetup('local')" style="align-self:center">开始游戏 ✦</button>
</div>

<!-- LOBBY -->
<div id="screen-lobby" class="screen">
  <div class="section-header">
    <div class="section-title">🛸 游戏大厅</div>
  </div>
  <div style="display:flex;gap:8px;padding:0 0 0.5rem">
    <input id="join-code-input" class="input-field" type="text" placeholder="输入房间码加入..." maxlength="8" style="flex:1;font-size:13px;text-transform:uppercase" oninput="this.value=this.value.toUpperCase()">
    <button class="btn-primary btn-sm" onclick="joinByCode()">加入</button>
  </div>
  <div id="rooms-grid" class="rooms-grid"><div style="text-align:center;padding:2rem;color:var(--text-dim)">扫描中... <span class="spinner"></span></div></div>
</div>

<!-- GAME -->
<div id="screen-game" class="screen">
  <div id="room-code-bar" style="display:none" class="room-code-bar">
    <span style="color:var(--text-dim);font-size:12px;font-weight:700">房间码</span>
    <span id="room-code-val" class="room-code-val"></span>
    <button class="copy-btn" onclick="copyCode()">复制链接</button>

  <div id="turn-banner" style="text-align:center;padding:0.4rem;font-family:'Fredoka One',cursive;font-size:16px;color:var(--yellow)">等待开始...</div>
  <div id="board-wrap" class="board-area">
    <div class="board-container" style="position:relative">
      <!-- 四角守护三眼仔 -->
      <img id="guardian-0" class="corner-guardian" style="top:-20px;left:-20px;transform:scaleX(-1)" src="" alt="">
      <img id="guardian-1" class="corner-guardian" style="top:-20px;right:-20px" src="" alt="">
      <img id="guardian-2" class="corner-guardian" style="bottom:-20px;right:-20px;transform:scaleX(-1)" src="" alt="">
      <img id="guardian-3" class="corner-guardian" style="bottom:-20px;left:-20px" src="" alt="">
      <svg id="ludo-board" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="dice-area">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;position:relative">
        <img id="dice-alien-face" style="position:absolute;top:-52px;left:50%;transform:translateX(-50%);width:46px;height:46px;object-fit:contain;display:none" src="" alt="">
        <div id="dice-face" class="dice" onclick="rollDice()"><svg viewBox="0 0 60 60"><g><circle cx="20" cy="20" r="4" fill="#2a1a05"/><circle cx="40" cy="40" r="4" fill="#2a1a05"/></g></svg></div>
        <div style="font-size:10px;color:var(--text-dim)">点击掷骰子</div>

      <div style="display:flex;flex-direction:column;gap:6px;min-width:120px">
        <div id="turn-info" style="font-family:'Fredoka One',cursive;font-size:15px">-</div>
        <div id="dice-result" style="font-size:12px;color:var(--text-dim)">等待掷骰...</div>
        <div id="move-hint" style="font-size:11px;color:#FFD53D"></div>
      </div>
    </div>
  </div>
  <div id="players-panel" class="players-panel"></div>
  <button class="btn-ghost btn-sm" onclick="leaveGame()" style="align-self:center">离开游戏</button>
</div>

</div><!-- /app -->

<!-- SETUP MODAL -->
<div id="setup-overlay" class="overlay hidden">
  <div class="modal">
    <div style="text-align:center"><img src="imgs/img_12c039e8.png" style="width:110px;height:110px;object-fit:contain;animation:bob 2.5s ease-in-out infinite">    </div>
    <h2>设置你的三眼仔</h2>
    <div class="form-group"><label class="form-label">昵称</label>
      <input id="nick-input" class="input-field" type="text" placeholder="输入昵称..." maxlength="12"></div>

  <label class="form-label">选择颜色</label>

    <div class="color-opt" data-cidx="1" style="background:#F59E0B" onclick="pickColor(1)" title="黄"></div>
    <div class="color-opt" data-cidx="2" style="background:#3B82F6" onclick="pickColor(2)" title="蓝"></div>
    <div class="color-opt" data-cidx="3" style="background:#22C55E" onclick="pickColor(3)" title="绿"></div>
  </div>
</div>
    <div class="form-group"><label class="form-label">选择角色</label>
      <div class="avatar-grid" id="avatar-grid"></div></div>
    <div id="setup-mode-opts" class="form-group"></div>
    <div class="modal-btns">
      <button class="btn-primary" onclick="confirmSetup()" style="flex:1">出发！</button>
      <button class="btn-ghost" onclick="closeSetup()">取消</button>
    </div>
  </div>
</div>

<!-- CREATE ROOM -->
<div id="create-overlay" class="overlay hidden">
  <div class="modal">
    <h2>🚀 创建飞行棋房间</h2>
    <div class="form-group"><label class="form-label">房间名称</label>
      <input id="room-name-input" class="input-field" type="text" placeholder="例：三眼仔特攻队" maxlength="20"></div>
    <div class="form-group"><label class="form-label">玩家人数</label>
      <select id="room-players" class="select-field">
        <option value="2">2人对战</option><option value="3">3人对战</option><option value="4" selected>4人对战（标准）</option>

    <div class="modal-btns">

      <button class="btn-ghost" onclick="closeCreateRoom()">取消</button>
    </div>

<!-- PATH EDITOR (visible only when URL has ?debug=path) -->
<div id="screen-path-editor" style="display:none;position:fixed;inset:0;z-index:900;background:#06112e;overflow:auto;padding:1rem;box-sizing:border-box">
  <div style="max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:0.75rem">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="font-family:'Fredoka One',cursive;font-size:20px;color:#FFD53D">🗺️ 路径编辑器</div>
      <div style="display:flex;gap:8px">
        <button class="btn-ghost btn-sm" onclick="pathEditorClear()">清除</button>
        <button class="btn-primary btn-sm" onclick="pathEditorCopy()">复制全部</button>
      </div>

      <svg id="path-editor-svg" viewBox="0 0 600 600" style="width:100%;height:auto;display:block;border-radius:8px;cursor:crosshair;box-shadow:0 4px 24px rgba(0,0,0,0.5)"></svg>

<!-- END -->
<div id="end-overlay" class="end-overlay hidden">

    <div id="end-winner-img"></div>

    <p id="end-msg" style="font-size:14px;color:var(--text-dim)"></p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:0.5rem">
      <button class="btn-primary" onclick="restartGame()">再来一局！</button>
      <button class="btn-ghost" onclick="leaveGame()">返回主页</button>
    </div>
  </div>

<script>
// D1-backed API on same origin (see worker/index.js).
async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  if (!res.ok) {
    let msg = res.statusText;
    try { const j = await res.json(); msg = j.error || msg; } catch(_) {}
    throw new Error(`${res.status} ${msg}`);
  }
  return res.status === 204 ? null : res.json();
}
const ALIENS = [
  {id:"blue_bunny",label:"蓝色兔子",src:"imgs/img_076b0b8f.png"},
  {id:"yellow_shirt",label:"黄色小鸭",src:"imgs/img_3993fe12.png"},
  {id:"pink_pig",label:"粉色猪猪",src:"imgs/img_7c33e684.png"},
  {id:"blue_monster",label:"蓝色毛怪",src:"imgs/img_dc0b8804.png"},
  {id:"red_hero",label:"红色英雄",src:"imgs/img_df53634f.png"},
  {id:"orange_fox",label:"橙色狐狸",src:"imgs/img_f0c5aefd.png"},
  {id:"blue_cap",label:"蓝色帽仔",src:"imgs/img_75ab6820.png"},
  {id:"pink_bear",label:"粉色小熊",src:"imgs/img_d761acdf.png"},
];
const IMG_MINE = "imgs/img_b4bec22e.png";
const IMG_HERO = "imgs/img_3e3220a9.png";
const IMG_MODAL = "imgs/img_12c039e8.png";



// ============================================================
// ALIEN EFFECTS — 三眼仔特效系统
// ============================================================

const CLAW_QUOTES = ["The Claw！", "我被选中了！", "命运的爪子！", "哦哦哦！", "The Claw is our master！", "它选择了我！", "敬畏The Claw！"];
const IMG_SCARED = IMG_MINE;
const IMG_CHEER  = IMG_HERO;
const IMG_FACE   = IMG_MODAL;

// 初始化四角守护三眼仔（只显示已加入玩家的角色）
function initGuardians() {
  const pd = JSON.parse(localStorage.getItem('ludo_players')||'[]');
  ['guardian-0','guardian-1','guardian-2','guardian-3'].forEach((id, i) => {
    const el = document.getElementById(id);
    if(!el) return;
    if(i < pd.length && pd[i]) {
      el.src = pd[i].src || ALIENS[i%ALIENS.length]?.src || '';
      el.style.display = '';
    } else {
      el.src = '';
      el.style.display = 'none';
    }

    st.forEach(s=>{
      s.o+=s.s;if(s.o>1||s.o<0.1)s.s*=-1;

function drawBoard(state) {
  const svg = document.getElementById('ludo-board');
  const S = 600;
  svg.setAttribute('viewBox', `0 0 ${S} ${S}`);
  let h = '';

  // 棋盘图片作为背景
  h += `<image href="./imgs/board2.jpg" x="0" y="0" width="600" height="600" preserveAspectRatio="xMidYMid meet"/>`;

  // Shared SVG defs: piece highlight gradient + drop-shadow filter + safe-cell glow
  h += `<defs>
    <radialGradient id="pieceHi" cx="35%" cy="30%" r="45%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.85)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <radialGradient id="safeGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="rgba(255,213,61,0.75)"/>
      <stop offset="70%" stop-color="rgba(255,213,61,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,213,61,0)"/>
    </radialGradient>
    <filter id="pdrop" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dy="1.5" result="off"/>
      <feFlood flood-color="#000" flood-opacity="0.45"/>
      <feComposite in2="off" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>`;

  const C = 20; // 每格 20px（600px / 30格）

  // ── Board decoration overlay ──
  // 1) Current player's base area: pulsing colored border (only during their turn)
  if(state && state.phase && state.winner == null) {
    const cur = Number(state.currentPlayer);
    const BASE_AREAS = [
      {x:0,   y:0,   w:120, h:120}, // p0 top-left
      {x:480, y:0,   w:120, h:120}, // p1 top-right
      {x:480, y:480, w:120, h:120}, // p2 bottom-right
      {x:0,   y:480, w:120, h:120}, // p3 bottom-left
    ];
    const a = BASE_AREAS[cur];
    if(a) {
      const col = P_COLORS[cur];
      h += `<rect x="${a.x+3}" y="${a.y+3}" width="${a.w-6}" height="${a.h-6}" fill="none" stroke="${col}" stroke-width="3" rx="10" opacity="0.75" style="pointer-events:none">
        <animate attributeName="opacity" values="0.4;0.95;0.4" dur="1.8s" repeatCount="indefinite"/>
      </rect>`;
    }
  }
  // 2) Safe-cell stars — only on the 4 mid-lane safe cells (not on start cells,
  //    which already have inward arrows on board2.jpg)
  [8, 21, 34, 47].forEach(idx => {
    if(idx >= 0 && idx < LUDO_OUTER.length) {
      const {r, c} = LUDO_OUTER[idx];
      const cx = (c + 0.5) * C, cy = (r + 0.5) * C;
      // 5-point star centered on cell
      const s = 6; // star radius
      const pts = [];
      for(let i = 0; i < 10; i++){
        const a = -Math.PI/2 + i * Math.PI/5;
        const rr = i%2===0 ? s : s*0.42;
        pts.push((cx + rr*Math.cos(a)).toFixed(1) + ',' + (cy + rr*Math.sin(a)).toFixed(1));
      }
      h += `<g opacity="0.9" style="pointer-events:none">
        <circle cx="${cx}" cy="${cy}" r="12" fill="url(#safeGlow)"/>
        <polygon points="${pts.join(' ')}" fill="#FFD53D" stroke="#B45309" stroke-width="0.8" stroke-linejoin="round"/>
      </g>`;
    }
  });
  // 3) Home-entry chevron arrows pointing inward (cardinal)
  const CHEVRON_DIR = [
    // dx,dy: which cardinal direction the arrow points (toward center)
    { dx:  1, dy:  0 }, // p0 red: right
    { dx:  0, dy:  1 }, // p1 yellow: down
    { dx: -1, dy:  0 }, // p2 blue: left
    { dx:  0, dy: -1 }, // p3 green: up
  ];
  P_HOME_ENTRY.forEach((idx, pi) => {
    if(idx >= 0 && idx < LUDO_OUTER.length) {
      const {r, c} = LUDO_OUTER[idx];
      const cx = (c + 0.5) * C, cy = (r + 0.5) * C;
      const {dx, dy} = CHEVRON_DIR[pi];
      const col = P_COLORS[pi], cold = P_DARK[pi];
      // Small chevron ▶ 5px long, offset to one edge of the cell
      const ox = dx * 8, oy = dy * 8;
      // Build 3-point triangle pointing toward (dx,dy)
      const tx = cx + ox, ty = cy + oy;
      const px = -dy * 3.5, py = dx * 3.5; // perpendicular
      const p1 = `${(tx + dx*3).toFixed(1)},${(ty + dy*3).toFixed(1)}`;
      const p2 = `${(tx - dx*2 + px).toFixed(1)},${(ty - dy*2 + py).toFixed(1)}`;
      const p3 = `${(tx - dx*2 - px).toFixed(1)},${(ty - dy*2 - py).toFixed(1)}`;
      h += `<polygon points="${p1} ${p2} ${p3}" fill="${col}" stroke="${cold}" stroke-width="0.6" stroke-linejoin="round" opacity="0.9" style="pointer-events:none"/>`;
    }
  });

  // 基地棋子槽：有玩家加入该颜色才叠加角色图片，无玩家则不叠加（保留图片原有虚线圆圈）
  {
    const BASE_SLOT_COORDS = [
      [{r:2,c:1},{r:2,c:4},{r:5,c:1},{r:5,c:4}],
      [{r:2,c:24},{r:2,c:27},{r:5,c:24},{r:5,c:27}],
      [{r:24,c:24},{r:24,c:27},{r:27,c:24},{r:27,c:27}],
      [{r:24,c:1},{r:24,c:4},{r:27,c:1},{r:27,c:4}],
    ];
    const pd = JSON.parse(localStorage.getItem('ludo_players')||'[]');
    BASE_SLOT_COORDS.forEach((slots, pi) => {
      const playerData = pd[pi];
      const avatarSrc = playerData ? playerData.src : '';
      if (!avatarSrc) return;
      slots.forEach((slot, si) => {
        const cx = (slot.c + 0.5) * C;
        const cy = (slot.r + 0.5) * C;
        h += `<defs><clipPath id="base_${pi}_${si}"><circle cx="${cx}" cy="${cy}" r="${C*0.7}"/></clipPath></defs>`;
        h += `<image href="${avatarSrc}" x="${cx-C*0.7}" y="${cy-C*0.7}" width="${C*1.4}" height="${C*1.4}" clip-path="url(#base_${pi}_${si})" preserveAspectRatio="xMidYMid slice"/>`;
      });
    });
  }
  // 棋子坐标系：基于图片实际布局
  // 图片约 15x15 格，每格约 40px（600/15）

  const BASE_SLOTS = [
    [{r:2,c:1},{r:2,c:4},{r:5,c:1},{r:5,c:4}],
    [{r:2,c:24},{r:2,c:27},{r:5,c:24},{r:5,c:27}],
    [{r:24,c:24},{r:24,c:27},{r:27,c:24},{r:27,c:27}],
    [{r:24,c:1},{r:24,c:4},{r:27,c:1},{r:27,c:4}],
  ];

  if(state) {
    const posMap = {};
    state.pieces.forEach(pc => {
      if(!pc.finished && pc.pos >= 0 && pc.pos < LUDO_OUTER.length) {
        if(!posMap[pc.pos]) posMap[pc.pos] = [];
        posMap[pc.pos].push(pc);
      }
    });

    const _pd_debug = JSON.parse(localStorage.getItem('ludo_players')||'[]');
    console.log('[drawBoard] pd:', _pd_debug.map((p,i)=>p?`[${i}]${p.name||'?'}(${p.src?'has-avatar':'NO-AVATAR'})`:null).filter(Boolean), 'pieces:', state.pieces.map(p=>`p${p.player}k${p.idx}@${p.pos}`));
    state.pieces.forEach(pc => {
      if(pc.finished) {
        // 到达终点，显示在中央风车区域
        const cx = (7 + (pc.idx%2)*0.6 - 0.3) * C;
        const cy = (7 + Math.floor(pc.idx/2)*0.6 - 0.3 + pc.player*0.15) * C;
        h += drawPiece(cx, cy, pc, state);
        return;
      }
      if(pc.pos === -1) {
        // 在基地
        const {r: dr, c: dc} = BASE_SLOTS[pc.player][pc.idx];
        h += drawPiece(dc * C + C/2, dr * C + C/2, pc, state);
      } else if(pc.pos >= 0 && pc.pos < LUDO_OUTER.length) {
        const {r, c} = LUDO_OUTER[pc.pos];
        const stack = posMap[pc.pos] || [pc];
        const si = stack.indexOf(pc);
        let ox = 0, oy = 0;
        if(stack.length === 2) {
          const offs2 = [-14, 14];
          ox = offs2[si] || 0;
        } else if(stack.length === 3) {
          const offs3 = [[-14,-8],[14,-8],[0,12]];
          ox = offs3[si] ? offs3[si][0] : 0;
          oy = offs3[si] ? offs3[si][1] : 0;
        } else if(stack.length >= 4) {
          const offs4 = [[-10,-10],[10,-10],[-10,10],[10,10]];
          ox = offs4[si] ? offs4[si][0] : 0;
          oy = offs4[si] ? offs4[si][1] : 0;
        }
        h += drawPieceAvatar((c + 0.5)*C + ox, (r + 0.5)*C + oy, pc, state);
      } else if(pc.pos === -2 && pc.homePos >= 0) {
        const lane = HOME_DISPLAY[pc.player];
        const cell = lane && lane[Math.min(pc.homePos, lane.length-1)];
        if(cell) h += drawPiece((cell.c+0.5)*C, (cell.r+0.5)*C, pc, state);
      }
    });
  }

  svg.innerHTML = h;
  svg.onclick = e => {
    const g = e.target.closest('[data-pc]');
    if(g) {
      const [pi,ki] = g.dataset.pc.split(',').map(Number);
      handlePieceClick(pi, ki);
    }
  };
}

// Shared piece renderer.
// r=16 for outer path, r=12 for finished/home-lane (smaller to stack in center).
function _renderPiece(cx, cy, pc, state, r) {
  const col = P_COLORS[pc.player], cold = P_DARK[pc.player];
  const isTurn = state && Number(state.currentPlayer) === Number(pc.player) && state.phase === 'move';
  const movable = isTurn && canMove(pc, state.diceVal, state);
  const clipId = 'pclip_' + pc.player + '_' + pc.idx + '_' + r;
  const pd = JSON.parse(localStorage.getItem('ludo_players')||'[]');
  const avatarSrc = pd[pc.player]?.src || '';
  if(!avatarSrc) return '';
  const inR = r - 2;
  // Movable: pulsing gold ring + subtle bob
  const pulseRing = movable ? `<circle cx="${cx}" cy="${cy}" r="${r+2}" fill="none" stroke="#FFD53D" stroke-width="1.8" opacity="0.75" style="pointer-events:none">
    <animate attributeName="r" values="${r+2};${r+6};${r+2}" dur="1.05s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1.05s" repeatCount="indefinite"/>
  </circle>` : '';
  const bob = movable ? `<animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0" dur="1.05s" repeatCount="indefinite"/>` : '';
  const shadowRy = Math.max(2, r * 0.18);
  return `<g data-pc="${pc.player},${pc.idx}" style="cursor:${movable?'pointer':'default'}">
    <ellipse cx="${cx}" cy="${cy+r+1.5}" rx="${r*0.72}" ry="${shadowRy}" fill="rgba(0,0,0,0.4)" style="pointer-events:none"/>
    ${pulseRing}
    <g>${bob}
      <defs><clipPath id="${clipId}"><circle cx="${cx}" cy="${cy}" r="${inR}"/></clipPath></defs>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="${col}" stroke="${cold}" stroke-width="${r>=14?1.8:1.4}"/>
      <image href="${avatarSrc}" x="${cx-inR}" y="${cy-inR}" width="${inR*2}" height="${inR*2}" clip-path="url(#${clipId})" preserveAspectRatio="xMidYMid slice"/>
      <ellipse cx="${cx - r*0.32}" cy="${cy - r*0.4}" rx="${r*0.28}" ry="${r*0.14}" fill="rgba(255,255,255,0.55)" transform="rotate(-25 ${cx - r*0.32} ${cy - r*0.4})" style="pointer-events:none"/>
    </g>
  </g>`;
}

function drawPieceAvatar(cx, cy, pc, state) { return _renderPiece(cx, cy, pc, state, 16); }
function drawPiece(cx, cy, pc, state)       { return _renderPiece(cx, cy, pc, state, 12); }

// B22: broadcast 失败自动重试 + B10: 给所有动作打上 sender color_idx
// payload: {room_id, player_id, action_type, dice_val?, piece_idx?, game_state?}
async function broadcastAction(payload, retries = 3) {
  if(!payload || !payload.room_id) return false;
  if(payload.game_state && typeof payload.game_state === 'object'){
    payload = {...payload, game_state: {...payload.game_state, _senderColorIdx: myPlayerIdx}};
  }
  const {room_id, ...body} = payload;
  for(let i = 0; i < retries; i++){
    try {
      const res = await api(`/api/rooms/${room_id}/actions`, { method:'POST', body: JSON.stringify(body) });
      if(res && res.action_id != null) lastActionId = Math.max(lastActionId, res.action_id);
      return true;
    } catch(e){
      console.warn(`[broadcast] 失败 ${i+1}/${retries}：`, e.message);
      await new Promise(r => setTimeout(r, 500 * (i+1)));
    }
  }
  toast('网络同步失败，请检查连接');
  return false;
}

// JSONB 反序列化后数字字段可能变字符串。所有 gs 入口(本地新建/远端接收)都过一遍这个,
// 避免下游 `pc.pos === -1` / `.diceVal === 6` / `SAFE_IDX.includes(pos)` 之类严格 === 踩雷。
function normalizeGs(g){
  if(!g || typeof g !== 'object') return g;
  if(Array.isArray(g.activePlayers)) g.activePlayers = g.activePlayers.map(Number);
  if(g.currentPlayer != null) g.currentPlayer = Number(g.currentPlayer);
  if(g.players != null) g.players = Number(g.players);
  if(g.diceVal != null) g.diceVal = Number(g.diceVal);
  if(Array.isArray(g.pieces)){
    g.pieces = g.pieces.map(pc => ({
      ...pc,
      player: Number(pc.player),
      idx: Number(pc.idx),
      pos: Number(pc.pos),
      homePos: pc.homePos != null ? Number(pc.homePos) : -1,
      finished: Boolean(pc.finished)
    }));
  }
  return g;
}

function newGame(activePlayers) {
  const pieces = [];
  for(let p of activePlayers) for(let k=0;k<4;k++) {
    pieces.push({player:p, idx:k, pos:-1, finished:false, homePos:-1});
  }
  return normalizeGs({activePlayers, players:activePlayers.length, currentPlayer:activePlayers[0], pieces, diceVal:null, phase:'roll', winner:null, log:[]});
}

function nextTurn(gs) {
  const active = (gs.activePlayers || [0,1,2,3]).map(Number);
  const idx = active.indexOf(Number(gs.currentPlayer));
  return active[(idx + 1) % active.length];
}

function canMove(pc, dice, state) {
  dice = Number(dice);
  if(!dice || pc.finished) return false;
  if(Number(pc.pos) === -1) return dice === 6;
  const np = nextPos(pc, dice);
  return np !== null;
}

function nextPos(pc, dice) {
  dice = Number(dice);
  if(pc.pos === -1) {
    return dice === 6 ? {pos:P_START[pc.player], home:false, homePos:-1} : null;
  }
  // 计算在外圈的相对位置
  const start = P_START[pc.player];
  const homeEntry = P_HOME_ENTRY[pc.player];
  const L = LUDO_OUTER.length;
  const rel = (pc.pos - start + L) % L;
  const heRel = (homeEntry - start + L) % L;
  const newRel = rel + dice;

  // B7: 从 HOME_ENTRY 掷 1 即进入跑道；hp = lane.length-1 时到达终点
  if(newRel >= heRel + 1) {
    const hp = newRel - heRel - 1;
    const lane = HOME_DISPLAY[pc.player];
    if(hp < lane.length) {
      return {pos:-2, home:true, homePos:hp, finished: hp === lane.length - 1};
    }
    return null; // 超过终点不能走，需精确步数
  }
  return {pos:(start + newRel % L) % L, home:false, homePos:-1};
}

async function doMove(pi, ki) {
  pi = Number(pi); ki = Number(ki);
  if(!gs || gs.phase!=='move' || Number(gs.currentPlayer)!==pi) return;
  const pc = gs.pieces.find(p=>Number(p.player)===pi&&Number(p.idx)===ki);
  if(!pc || !canMove(pc, gs.diceVal, gs)) return;

  const result = nextPos(pc, gs.diceVal);
  if(!result) return;

  sndMove();

  if(result.home) {
    pc.pos = -2;
    if(result.finished) {
      // B16: 终点统一用 HOME_DISPLAY[player].length-1，避免魔法数字
      pc.finished = true;
      pc.homePos = HOME_DISPLAY[pc.player].length - 1;
      log(`${P_NAMES[pi]} 棋子${ki+1} 到达终点！🏆`);
    } else {
      pc.homePos = result.homePos;
      log(`${P_NAMES[pi]} 棋子${ki+1} 进入终点跑道第${result.homePos+1}格`);
    }
  } else {
    pc.pos = result.pos;
    log(`${P_NAMES[pi]} 掷了 ${gs.diceVal}，棋子${ki+1} 前进`);
    // 棋子跳跃动画
    if(pc.pos < DISPLAY_PATH.length) {
      const {r,c} = DISPLAY_PATH[pc.pos];
      animatePieceJump((c+0.5)*40, (r+0.5)*40);
    }
    // 吃子
    gs.pieces.forEach(other => {
      if(Number(other.player)===Number(pi)||Number(other.pos)!==Number(pc.pos)||other.finished||Number(other.pos)===-1) return;
      // B18: 叠子保护 — 目标格上有 2 个或以上同方棋子则不能吃
      const sameTeamOnCell = gs.pieces.filter(p =>
        Number(p.player) === Number(other.player) &&
        Number(p.pos) === Number(other.pos) &&
        !p.finished
      );
      if(sameTeamOnCell.length >= 2){
        log(`${P_NAMES[other.player]} 叠子保护！💎 无法吃子`);
        return;
      }
      const safe = SAFE_IDX.includes(Number(pc.pos));
      if(!safe) {
        // 吃子特效 + 被吃棋子飞回基地
        if(other.pos < DISPLAY_PATH.length) {
          const {r,c} = DISPLAY_PATH[other.pos];
          const sc = boardToScreen(r,c);
          alienEatEffect(sc.x, sc.y);
          flyPieceHome(other, sc.x, sc.y);
        }
        other.pos = -1; other.homePos = -1;
        sndEat(); showEatPopup();
        log(`${P_NAMES[pi]} 吃掉了 ${P_NAMES[other.player]} 的棋子！💥 送回基地`);
        gs.extraRoll = true; // B1: 吃子后再掷一次
      } else {
        // 安全格特效
        if(pc.pos < DISPLAY_PATH.length) {
          const {r,c} = DISPLAY_PATH[pc.pos];
          const sc = boardToScreen(r,c);
          safeZoneEffect(sc.x, sc.y);
        }
        sndSafe();
        log(`安全格保护！无法吃子 🛡️`);
      }
    });
  }

  const winner = checkWin(gs);
  if(winner >= 0) {
    // B2: 联机模式先广播 win 动作，确保远端玩家看到结算画面（B22 重试）
    if(gameMode==='online' && currentRoomId){
      await broadcastAction({
        room_id: currentRoomId,
        player_id: myPlayerId,
        action_type: 'win',
        game_state: JSON.parse(JSON.stringify(gs))
      });
      // postAction 已 mirror game_state 到 room；这里只标 status='ended'
      try { await api(`/api/rooms/${currentRoomId}`, { method:'PATCH', body: JSON.stringify({status:'ended'}) }); }
      catch(e){ console.warn('mark ended failed:', e.message); }
    }
    endGame(winner);
    return;
  }

  gs.diceVal = null;
  if(gs.extraRoll) {
    gs.phase='roll'; gs.extraRoll=false;
  } else {
    gs.currentPlayer = nextTurn(gs);
    gs.phase='roll';
  }

  // 联机广播移动动作（B22 重试）— postAction 顺手把 game_state 镜像到 room
  if(gameMode==='online' && currentRoomId){
    await broadcastAction({
      room_id: currentRoomId, player_id: myPlayerId,
      action_type: 'move', piece_idx: ki,
      game_state: JSON.parse(JSON.stringify(gs))
    });
  }

  drawBoard(gs); updateUI();
}

function checkWin(gs) {
  const players = [...new Set(gs.pieces.map(p => p.player))];
  for(const player of players) {
    const pieces = gs.pieces.filter(p => p.player === player);
    if(pieces.every(p => p.finished)) {
      return player;
    }
  }
  return -1;
}

// SVG dice face renderer (replaces Unicode ⚀⚁⚂⚃⚄⚅ — inconsistent across fonts)
const DICE_DOT_POS = {
  1: [[30,30]],
  2: [[18,18],[42,42]],
  3: [[18,18],[30,30],[42,42]],
  4: [[18,18],[42,18],[18,42],[42,42]],
  5: [[18,18],[42,18],[30,30],[18,42],[42,42]],
  6: [[16,18],[44,18],[16,30],[44,30],[16,42],[44,42]]
};
function renderDiceFace(val) {
  const v = Number(val);
  const dots = DICE_DOT_POS[v];
  if(!dots) return '<svg viewBox="0 0 60 60"><circle cx="20" cy="20" r="4" fill="#2a1a05"/><circle cx="40" cy="40" r="4" fill="#2a1a05"/></svg>';
  const body = dots.map(([x,y]) => `<circle cx="${x}" cy="${y}" r="5" fill="#2a1a05"/>`).join('');
  return `<svg viewBox="0 0 60 60">${body}</svg>`;
}

function rollDice() {
  if(!gs||gs.phase!=='roll') return;
  if(gameMode==='online'&&Number(gs.currentPlayer)!==Number(myPlayerIdx)) return;
  console.log('[rollDice] myPlayerIdx:', myPlayerIdx, 'gs.currentPlayer:', gs.currentPlayer);
  const el = document.getElementById('dice-face');
  el.classList.add('rolling','disabled');
  sndDice();
  showDiceFace(true); // 显示骰子三眼仔表情
  let n=0;
  const t=setInterval(async ()=>{
    el.innerHTML=renderDiceFace(Math.floor(Math.random()*6)+1);
    if(++n>=10) {
      clearInterval(t);
      el.classList.remove('rolling','disabled');
      const v=Math.floor(Math.random()*6)+1;
      el.innerHTML=renderDiceFace(v);
      el.classList.remove('settle');void el.offsetWidth;el.classList.add('settle');
      gs.diceVal=v;
      document.getElementById('dice-result').textContent=`掷到了 ${v} 点`;
      showDiceFace(false);
      alienCheer(v); // 三眼仔欢呼特效
      // B17: 连续 3 个 6 自动跳过本回合
      if(v === 6) {
        gs.consecutive6 = (gs.consecutive6 || 0) + 1;
        if(gs.consecutive6 >= 3) {
          gs.consecutive6 = 0;
          gs.diceVal = null;
          gs.extraRoll = false;
          toast('连续3个6！跳过本回合');
          gs.currentPlayer = nextTurn(gs);
          if(gameMode==='online' && currentRoomId){
            await broadcastAction({
              room_id:currentRoomId, player_id:myPlayerId,
              action_type:'roll', dice_val:v,
              game_state: JSON.parse(JSON.stringify(gs))
            });
          }
          updateUI();
          return;
        }
      } else {
        gs.consecutive6 = 0;
      }
      onRolled(v);
    }
  },55);
}

async function onRolled(v) {
  const cur=gs.currentPlayer;
  const myPcs=gs.pieces.filter(p=>p.player===cur&&!p.finished);
  const movable=myPcs.filter(pc=>canMove(pc,v,gs));

  if(v===6) { gs.extraRoll=true; }

  // Helper: broadcast a deep-copy snapshot of gs（B22 重试）
  async function broadcastRoll() {
    if(gameMode==='online' && currentRoomId){
      const snap = JSON.parse(JSON.stringify(gs));
      console.log('[broadcastRoll] currentPlayer:', snap.currentPlayer, 'phase:', snap.phase);
      await broadcastAction({
        room_id:currentRoomId, player_id:myPlayerId,
        action_type:'roll', dice_val:v, game_state:snap
      });
    }
  }

  if(movable.length===0) {
    log(`${P_NAMES[cur]} 掷了 ${v}，无子可动`);
    document.getElementById('move-hint').textContent='😅 没有可动的棋子，自动跳过';
    // Wait for the skip animation, then update state and broadcast
    await new Promise(r=>setTimeout(r,900));
    if(v===6) { gs.phase='roll'; gs.diceVal=null; gs.extraRoll=false; }
    else { gs.currentPlayer=nextTurn(gs); gs.phase='roll'; gs.diceVal=null; }
    drawBoard(gs); updateUI();
    await broadcastRoll();
    return;
  }

  if(movable.length===1&&movable[0].pos===-1&&v===6) {
    gs.phase='move';
    document.getElementById('move-hint').textContent='棋子自动出基地！';
    await broadcastRoll();
    setTimeout(()=>doMove(cur, movable[0].idx), 400);
    return;
  }

  gs.phase='move';
  document.getElementById('move-hint').textContent='点击你的棋子移动';
  await broadcastRoll();
  drawBoard(gs); updateUI();
}

function handlePieceClick(pi,ki) {
  console.log('[click] pi:', pi, 'ki:', ki, 'myPlayerIdx:', myPlayerIdx, 'currentPlayer:', gs?.currentPlayer, 'phase:', gs?.phase, 'mode:', gameMode);
  if(!gs||gs.phase!=='move'||Number(gs.currentPlayer)!==Number(pi)) { console.log('[click] blocked: phase/currentPlayer mismatch'); return; }
  if(gameMode==='online'&&Number(pi)!==Number(myPlayerIdx)) { console.log('[click] blocked: not my piece'); return; }
  doMove(pi,ki);
}

let _lastMyRollTurn = false;
function updateUI() {
  if(!gs) return;
  const cur = Number(gs.currentPlayer);           // coerce — JSONB can return strings
  const myIdx = Number(myPlayerIdx);
  const isMyTurn = (gameMode === 'local') || (cur === myIdx);
  console.log('[updateUI] myIdx:', myIdx, 'currentPlayer:', cur, 'isMyTurn:', isMyTurn, 'phase:', gs.phase, 'mode:', gameMode);

  // Detect "my roll turn just started" transition for a brief banner emphasis
  // (online mode only — local is always your turn, would trigger every turn)
  const myRollTurnNow = gameMode === 'online' && isMyTurn && gs.phase === 'roll';
  const turnJustStarted = myRollTurnNow && !_lastMyRollTurn;
  _lastMyRollTurn = myRollTurnNow;

  document.getElementById('turn-info').textContent=`${P_NAMES[cur]} 的回合`;
  document.getElementById('turn-info').style.color=P_COLORS[cur];

  const banner=document.getElementById('turn-banner');
  if(turnJustStarted){
    banner.classList.remove('banner-turn-attn');
    void banner.offsetWidth; // force reflow so animation replays
    banner.classList.add('banner-turn-attn');
  }
  if(gameMode==='online'){
    if(isMyTurn && gs.phase==='roll'){
      banner.innerHTML = `<span style="color:${P_COLORS[cur]}">${P_EMOJIS[cur]} ${P_NAMES[cur]}掷骰子</span>`;
      banner.style.color=P_COLORS[cur];
      banner.classList.add('banner-pulse');
    } else if(isMyTurn && gs.phase==='move'){
      banner.innerHTML = `<span style="color:${P_COLORS[cur]}">🎯 选一颗棋子移动</span>`;
      banner.style.color=P_COLORS[cur];
      banner.classList.remove('banner-pulse');
    } else {
      const pd = JSON.parse(localStorage.getItem('ludo_players')||'[]');
      const p = pd[cur];
      const name = p?.name || P_NAMES[cur];
      const src = p?.src || ALIENS[cur%ALIENS.length]?.src || '';
      const avatarHtml = src ? `<img src="${src}" alt="">` : '';
      banner.innerHTML = `<span class="wait-indicator">⏳ 等待 ${avatarHtml}<b style="color:${P_COLORS[cur]}">${esc(name)}</b> 行动<span class="wait-dots"><span></span><span></span><span></span></span></span>`;
      banner.style.color='var(--text-dim)';
      banner.classList.remove('banner-pulse');
    }
  } else {
    banner.innerHTML = gs.phase==='roll'
      ? `<span style="color:${P_COLORS[cur]}">${P_EMOJIS[cur]} ${P_NAMES[cur]}掷骰子</span>`
      : `<span style="color:${P_COLORS[cur]}">🎯 ${P_NAMES[cur]}选棋子移动</span>`;
    banner.style.color=P_COLORS[cur];
    banner.classList.remove('banner-pulse');
  }

  const dice=document.getElementById('dice-face');
  const canRoll = isMyTurn && gs.phase==='roll';
  dice.classList.toggle('disabled', !canRoll);
  dice.classList.toggle('my-turn', canRoll);
  if(gs.phase==='roll' && dice.querySelector('svg') == null) dice.innerHTML = renderDiceFace(0);
  // Border color follows current player
  dice.style.borderColor = P_DARK[cur] || '#333';

  const mh=document.getElementById('move-hint');
  if(mh){
    if(gs.phase==='roll'){
      if(isMyTurn){ mh.textContent='👆 现在轮到你！点击骰子'; mh.style.color=P_COLORS[cur]; }
      else { mh.textContent='⏳ 等待对方操作...'; mh.style.color='var(--text-dim)'; }
    } else if(gs.phase==='move'){
      if(isMyTurn){
        const myPcs=gs.pieces.filter(p=>Number(p.player)===cur&&canMove(p,gs.diceVal,gs));
        const hasInBase=myPcs.some(p=>p.pos===-1);
        if(gs.diceVal===6&&hasInBase){
          mh.textContent='🎉 掷到6！点击基地里的棋子出发'; mh.style.color='#FFD53D';
        } else {
          const canCapture=myPcs.some(p=>{
            if(p.pos<0) return false;
            const res=nextPos(p,gs.diceVal);
            return res&&!res.home&&gs.pieces.some(o=>Number(o.player)!==cur&&o.pos===res.pos&&!o.finished&&!SAFE_IDX.includes(res.pos));
          });
          if(canCapture){ mh.textContent='⚠️ 可以吃掉对方棋子！'; mh.style.color='var(--warning)'; }
          else { mh.textContent='👆 点击你的棋子移动'; mh.style.color='var(--success)'; }
        }
      } else {
        mh.textContent='⏳ 等待对方操作...'; mh.style.color='var(--text-dim)';
      }
    }
  }
  renderPanel();
}

function renderPanel() {
  if(!gs) return;
  const pd=JSON.parse(localStorage.getItem('ludo_players')||'[]');
  const active = gs.activePlayers || Array.from({length:numPlayers},(_,k)=>k);
  document.getElementById('players-panel').innerHTML=active.map(ci=>{
    const i=Number(ci);
    const p=pd[i]||{name:P_NAMES[i],src:ALIENS[i%ALIENS.length]?.src||ALIENS[0].src};
    const pcs=gs.pieces.filter(pc=>Number(pc.player)===i);
    const fin=pcs.filter(pc=>pc.finished).length;
    const out=pcs.filter(pc=>pc.pos>=0&&!pc.finished).length;
    const base=pcs.filter(pc=>pc.pos===-1).length;
    const isCur=Number(gs.currentPlayer)===i;
    const cls = 'player-card' + (isCur ? ' current-turn' : '');
    const style = isCur
      ? `border-color:${P_COLORS[i]};--pc-glow:${P_COLORS[i]}`
      : `border-color:rgba(255,255,255,0.08)`;
    return `<div class="${cls}" style="${style}">
      <img src="${p.src}" style="width:34px;height:34px;object-fit:contain">
      <div style="flex:1;min-width:0">
        <div class="player-name" style="color:${P_COLORS[i]};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</div>
        <div class="player-status">🏠${base} 🎮${out} 🏆${fin}</div>
      </div>
      <div class="pieces-row">${pcs.map(pc=>`<div class="piece-mini" style="background:${pc.finished?'#FFD53D':P_COLORS[i]};opacity:${pc.pos===-1?.3:1}"></div>`).join('')}</div>
    </div>`;
  }).join('');
}

function log(msg) {
  if(!gs) return;
  gs.log=[msg,...(gs.log||[])].slice(0,10);
}

function renderAvatarGrid(){
  document.getElementById('avatar-grid').innerHTML=ALIENS.map(a=>`
    <div class="avatar-opt${a.id===myAvatarId?' selected':''}" onclick="selAvatar('${a.id}')">
      <img src="${a.src}"><span>${a.label}</span>
    </div>`).join('');

function confirmSetup(){
  if(myColorIdx === -1) { showToast('请先选择颜色！'); return; }
  const nick=document.getElementById('nick-input').value.trim();
  if(!nick){toast('请输入昵称！');return;}

    startLocal(np);

function startLocal(np) {
  numPlayers=np; gameMode='local'; myPlayerIdx=0;
  const activePlayers = Array.from({length:np},(_,i)=>i);
  gs=newGame(activePlayers);
  const pd=new Array(4).fill(null);
  activePlayers.forEach(i=>{ pd[i]={name:i===0?myNick:P_NAMES[i],src:ALIENS[i%ALIENS.length]?.src||ALIENS[0].src}; });
  localStorage.setItem('ludo_players',JSON.stringify(pd));
  showScreen('game');
  document.getElementById('room-code-bar').style.display='none';
  drawBoard(gs); updateUI();
  initGuardians();

async function loadRooms(){
  const g=document.getElementById('rooms-grid');
  g.innerHTML='<div style="text-align:center;padding:2rem;color:var(--text-dim)">扫描中... <span class="spinner"></span></div>';
  let data;
  try { data = await api('/api/rooms'); }
  catch(e){ console.warn('loadRooms:', e.message); g.innerHTML=demoRooms(); return; }
  // Auto-delete orphaned rooms (host left without cleaning up)
  const orphans=data.filter(r=>!r.player_count);
  orphans.forEach(r=>{ api(`/api/rooms/${r.id}`, {method:'DELETE'}).catch(()=>{}); });
  const live=data.filter(r=>r.player_count>0);
  const createCard='<div class="create-card" onclick="openCreateRoom()">＋ 创建新房间</div>';
  if(!live.length){g.innerHTML='<div style="text-align:center;padding:2rem;color:var(--text-dim)">暂无房间</div>'+createCard;return;}
  const cards=live.map(r=>{
    const mine=r.host_id===myPlayerId;
    const delBtn=mine?`<button class="room-del-btn" onclick="event.stopPropagation();deleteRoom('${r.id}')" title="删除房间">✕</button>`:'';
    const pct = Math.min(100, Math.round((r.player_count / r.max_players) * 100));
    return `<div class="room-card" onclick="joinOnlineRoom('${r.id}')">
      ${delBtn}
      <div class="room-card-head"><span class="room-name">${esc(r.name)}</span><span class="badge">等待中</span></div>
      <div class="room-meta">${r.max_players}人对战 · ${r.player_count}人已加入</div>
      <div class="room-progress"><div class="room-progress-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
  g.innerHTML=cards+createCard;
}
async function deleteRoom(rid){
  try { await api(`/api/rooms/${rid}`, {method:'DELETE'}); toast('房间已删除'); }
  catch(e){ toast('删除失败：'+e.message); return; }
  loadRooms();
}
