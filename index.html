<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>三眼仔飞行棋</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#06112e; --card:rgba(255,255,255,0.05); --border:rgba(255,255,255,0.1);
  --radius:16px; --yellow:#ffd166; --green:#c8e84a; --blue:#2b7fd4;
  --text:#e8f4f8; --text-dim:#8ecae6;
  --p0:#e63946; --p1:#2b7fd4; --p2:#06d6a0; --p3:#ffd166;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:'Nunito',sans-serif;background:var(--sky);color:var(--text);overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 100% 55% at 50% 0%,#0d2660 0%,transparent 65%),
  radial-gradient(ellipse 50% 40% at 85% 90%,rgba(100,40,130,0.3) 0%,transparent 55%);}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:0.75rem;
  display:flex;flex-direction:column;gap:0.75rem;min-height:100vh}

nav{display:flex;align-items:center;justify-content:space-between;padding:0.6rem 1rem;
  background:rgba(6,17,46,0.9);border:1px solid rgba(43,127,212,0.25);
  border-radius:var(--radius);backdrop-filter:blur(12px)}
.logo{display:flex;align-items:center;gap:8px;font-family:'Fredoka One',cursive;font-size:20px;color:var(--yellow)}
.logo img{width:40px;height:30px;object-fit:cover;border-radius:6px}
.nav-links{display:flex;gap:6px}
.nav-btn{background:transparent;border:1px solid rgba(255,255,255,0.12);border-radius:10px;
  padding:6px 14px;font-size:13px;font-weight:700;color:var(--text-dim);cursor:pointer;font-family:inherit;transition:all 0.2s}
.nav-btn:hover,.nav-btn.active{background:rgba(43,127,212,0.2);border-color:var(--blue);color:#6db8ff}

.screen{display:none;flex-direction:column;gap:0.75rem;animation:fadeUp 0.2s ease}
.screen.active{display:flex}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* HOME */
.hero{text-align:center;padding:1rem 0.5rem;display:flex;flex-direction:column;align-items:center;gap:1rem}
.hero-img{max-width:min(360px,80vw);height:auto;filter:drop-shadow(0 8px 24px rgba(0,0,0,0.3));animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hero h1{font-family:'Fredoka One',cursive;font-size:clamp(26px,6vw,40px);
  background:linear-gradient(135deg,var(--yellow),var(--green));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-feats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.feat{padding:5px 12px;border-radius:20px;background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);font-size:12px;font-weight:700;color:var(--text-dim)}
.home-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* RULES */
.rules-card{background:rgba(6,17,46,0.8);border:1px solid rgba(43,127,212,0.15);border-radius:var(--radius);padding:1rem 1.25rem}
.rules-title{font-family:'Fredoka One',cursive;font-size:15px;color:var(--yellow);margin-bottom:0.6rem}
.rules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.rule-item{display:flex;gap:8px;align-items:flex-start;font-size:12px}
.rule-icon{font-size:18px;flex-shrink:0}
.rule-text strong{display:block;font-size:13px;font-weight:800;margin-bottom:1px}
.rule-text span{color:var(--text-dim)}

/* BUTTONS */
.btn-primary{background:linear-gradient(135deg,#2b9fd4,#1a5fa8);color:#fff;border:none;
  border-radius:10px;padding:12px 28px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;
  transition:all 0.2s;box-shadow:0 4px 16px rgba(43,127,212,0.35)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(43,127,212,0.5)}
.btn-ghost{background:rgba(255,255,255,0.05);color:var(--text);border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;padding:11px 22px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s}
.btn-ghost:hover{background:rgba(255,255,255,0.1)}
.btn-sm{padding:7px 16px;font-size:13px}

/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(3,8,24,0.85);display:flex;align-items:center;
  justify-content:center;z-index:100;backdrop-filter:blur(8px)}
.overlay.hidden{display:none}
.modal{background:linear-gradient(160deg,#0d1f4a,#081228);border:1px solid rgba(43,127,212,0.3);
  border-radius:var(--radius);padding:1.75rem;width:min(400px,94vw);display:flex;flex-direction:column;gap:1rem;
  box-shadow:0 0 40px rgba(43,127,212,0.15);max-height:90vh;overflow-y:auto}
.modal h2{font-family:'Fredoka One',cursive;font-size:20px;color:var(--yellow)}
.input-field{background:rgba(255,255,255,0.06);border:1px solid rgba(43,127,212,0.3);
  border-radius:10px;padding:10px 14px;color:var(--text);font-size:15px;font-family:inherit;
  width:100%;outline:none;transition:border-color 0.2s}
.input-field:focus{border-color:var(--blue)}
.select-field{background:rgba(255,255,255,0.06);border:1px solid rgba(43,127,212,0.3);
  border-radius:10px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit;width:100%;outline:none}
.form-label{font-size:13px;font-weight:700;color:var(--text-dim);margin-bottom:4px;display:block}
.form-group{display:flex;flex-direction:column;gap:4px}
.modal-btns{display:flex;gap:8px}

/* AVATAR PICKER */
.avatar-grid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.avatar-opt{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:6px;border-radius:12px;border:2px solid rgba(255,255,255,0.1);
  background:transparent;transition:all 0.15s;width:70px}
.avatar-opt:hover{border-color:rgba(255,255,255,0.3)}
.avatar-opt.selected{border-color:var(--yellow);background:rgba(255,209,70,0.12)}
.avatar-opt img{width:50px;height:50px;object-fit:contain}
.avatar-opt span{font-size:9px;font-weight:700;color:var(--text-dim);text-align:center;line-height:1.2}
.color-opts{display:flex;gap:10px;justify-content:center}
.color-opt{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all 0.15s}
.color-opt.selected{border-color:#fff;transform:scale(1.2);box-shadow:0 0 8px rgba(255,255,255,0.4)}

/* LOBBY */
.section-header{display:flex;align-items:center;justify-content:space-between}
.section-title{font-family:'Fredoka One',cursive;font-size:18px;color:var(--yellow)}
.rooms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.room-card{background:rgba(6,17,46,0.85);border:1px solid rgba(43,127,212,0.18);
  border-radius:var(--radius);padding:1rem;cursor:pointer;transition:all 0.2s;position:relative}
.room-card:hover{border-color:rgba(43,127,212,0.45);transform:translateY(-2px)}
.room-del-btn{position:absolute;top:6px;right:6px;background:rgba(230,57,70,0.75);color:#fff;
  border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.room-del-btn:hover{background:#e63946}
.room-name{font-size:14px;font-weight:800}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:rgba(43,127,212,0.2);color:#6db8ff}
.room-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.room-meta{font-size:12px;color:var(--text-dim);margin-bottom:8px}
.room-avatars{display:flex;gap:4px}
.create-card{background:rgba(6,17,46,0.5);border:2px dashed rgba(43,127,212,0.2);
  border-radius:var(--radius);padding:1rem;cursor:pointer;transition:all 0.2s;
  display:flex;align-items:center;justify-content:center;gap:8px;min-height:100px;
  color:var(--text-dim);font-size:14px;font-weight:700}
.create-card:hover{background:rgba(43,127,212,0.06);border-color:rgba(43,127,212,0.4);color:#6db8ff}

/* GAME */
.room-code-bar{display:flex;align-items:center;justify-content:space-between;
  background:rgba(100,40,130,0.15);border:1px solid rgba(155,63,168,0.3);
  border-radius:10px;padding:7px 14px;font-size:13px}
.room-code-val{font-family:'Space Mono',monospace;font-weight:700;color:#d09dff;letter-spacing:3px}
.copy-btn{background:rgba(155,63,168,0.12);border:1px solid rgba(155,63,168,0.3);
  border-radius:8px;padding:4px 10px;color:#d09dff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.board-area{display:flex;flex-direction:column;align-items:center;gap:0.75rem}
.board-container{position:relative;width:100%;max-width:500px;margin:0 auto}
#ludo-board{width:100%;height:auto;display:block;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,0.5);cursor:pointer}

/* DICE */
.dice-area{display:flex;align-items:center;justify-content:center;gap:1rem;
  background:rgba(6,17,46,0.8);border:1px solid rgba(43,127,212,0.2);
  border-radius:var(--radius);padding:0.8rem 1.2rem;width:100%;max-width:500px}
.dice{width:64px;height:64px;background:white;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:36px;cursor:pointer;transition:all 0.2s;
  box-shadow:0 4px 16px rgba(0,0,0,0.4);user-select:none;border:3px solid rgba(0,0,0,0.1)}
.dice:hover:not(.disabled){transform:scale(1.1) rotate(-5deg)}
.dice.disabled{opacity:0.35;cursor:not-allowed}
.dice.rolling{animation:diceRoll 0.5s ease}
@keyframes diceRoll{0%{transform:rotate(0)}25%{transform:rotate(-20deg) scale(1.1)}75%{transform:rotate(15deg) scale(1.15)}100%{transform:rotate(0) scale(1)}}
.dice.my-turn{animation:diceRing 1.2s ease-in-out infinite}
@keyframes diceRing{0%,100%{box-shadow:0 0 0 0 rgba(255,213,102,0.8),0 4px 16px rgba(0,0,0,0.4)}50%{box-shadow:0 0 0 14px rgba(255,213,102,0),0 4px 16px rgba(0,0,0,0.4)}}
.eat-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(230,57,70,0.92);color:#fff;font-family:'Fredoka One',cursive;
  font-size:22px;padding:12px 28px;border-radius:20px;z-index:600;
  animation:eatPopIn 1.5s ease forwards;pointer-events:none;white-space:nowrap}
@keyframes eatPopIn{0%{opacity:0;transform:translate(-50%,-50%) scale(0.3)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(0.8)}}
@keyframes bannerFlash{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.7;transform:scale(1.04)}}
.banner-pulse{animation:bannerFlash 0.9s ease-in-out infinite}

/* PLAYERS PANEL */
.players-panel{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%;max-width:500px}
.player-card{background:rgba(6,17,46,0.8);border:2px solid rgba(255,255,255,0.08);
  border-radius:12px;padding:0.6rem 0.8rem;display:flex;align-items:center;gap:8px;transition:all 0.3s}
.player-name{font-weight:800;font-size:13px}
.player-status{font-size:11px;color:var(--text-dim)}
.piece-mini{width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(0,0,0,0.3);display:inline-block}
.pieces-row{display:flex;gap:3px;flex-wrap:wrap}

/* GAME LOG */
.game-log{background:rgba(6,17,46,0.7);border:1px solid rgba(43,127,212,0.15);
  border-radius:12px;padding:0.6rem 0.8rem;max-height:90px;overflow-y:auto;
  font-size:12px;width:100%;max-width:500px}
.log-entry{padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.05);color:var(--text-dim)}
.log-entry:last-child{border-bottom:none;color:var(--text)}

/* END */
.end-overlay{position:fixed;inset:0;background:rgba(3,8,24,0.9);display:flex;align-items:center;
  justify-content:center;z-index:50;backdrop-filter:blur(10px)}
.end-overlay.hidden{display:none}
.end-box{background:linear-gradient(160deg,#0d1f4a,#081228);border:1px solid rgba(43,127,212,0.3);
  border-radius:var(--radius);padding:2rem;text-align:center;max-width:320px;width:92%;
  display:flex;flex-direction:column;gap:0.75rem;align-items:center}
.end-box h2{font-family:'Fredoka One',cursive;font-size:26px;color:var(--yellow)}


/* ── ALIEN EFFECTS ── */

/* 投骰子时三眼仔欢呼 */
.dice-alien-cheer {
  position:fixed;bottom:120px;left:50%;transform:translateX(-50%);
  z-index:500;pointer-events:none;
  animation:alienCheer 0.8s ease forwards;
}
@keyframes alienCheer {
  0%{transform:translateX(-50%) translateY(60px) scale(0.5);opacity:0}
  40%{transform:translateX(-50%) translateY(-20px) scale(1.15);opacity:1}
  70%{transform:translateX(-50%) translateY(0) scale(1);opacity:1}
  100%{transform:translateX(-50%) translateY(0) scale(1);opacity:0}
}

/* 棋子跳跃动画 */
@keyframes pieceJump {
  0%{transform:translateY(0) scale(1)}
  30%{transform:translateY(-18px) scale(1.2)}
  60%{transform:translateY(-8px) scale(1.1)}
  80%{transform:translateY(-2px) scale(1.05)}
  100%{transform:translateY(0) scale(1)}
}
.piece-jumping { animation: pieceJump 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }

/* 吃子特效：惊吓三眼仔弹出 */
.eat-effect {
  position:fixed;z-index:500;pointer-events:none;
  animation:eatPop 1.2s ease forwards;
}
@keyframes eatPop {
  0%{transform:scale(0) rotate(-20deg);opacity:0}
  20%{transform:scale(1.4) rotate(10deg);opacity:1}
  50%{transform:scale(1.1) rotate(-5deg);opacity:1}
  70%{transform:scale(1.2) rotate(0deg) translateY(-30px);opacity:1}
  100%{transform:scale(0.8) rotate(5deg) translateY(-80px);opacity:0}
}

/* 棋子被吃时惊吓小弹窗 */
.piece-scared {
  position:fixed;z-index:501;pointer-events:none;
  animation:scaredPop 1s ease forwards;
}
@keyframes scaredPop {
  0%{transform:scale(0);opacity:0}
  30%{transform:scale(1.3);opacity:1}
  60%{transform:scale(1) translateY(-20px);opacity:1}
  100%{transform:scale(0.5) translateY(-60px);opacity:0}
}

/* 胜利：三眼仔从天而降 */
.alien-rain {
  position:fixed;z-index:400;pointer-events:none;
  animation:alienRain linear forwards;
}
@keyframes alienRain {
  0%{transform:translateY(-120px) rotate(var(--rot)) scale(var(--sc));opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{transform:translateY(110vh) rotate(calc(var(--rot) + 360deg)) scale(var(--sc));opacity:0}
}

/* 胜利灯光放射 */
.victory-light {
  position:fixed;top:50%;left:50%;z-index:399;pointer-events:none;
  width:0;height:0;
  animation:victoryLight 2s ease forwards;
}
.victory-light::before {
  content:'';position:absolute;top:50%;left:50%;
  width:300vw;height:300vw;
  transform:translate(-50%,-50%);
  background:radial-gradient(ellipse at center, rgba(255,209,70,0.35) 0%, transparent 65%);
  animation:lightPulse 0.5s ease-out;
}
@keyframes lightPulse {
  0%{transform:translate(-50%,-50%) scale(0);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1);opacity:0}
}

/* 骰子滚动时的三眼仔表情 */
.dice-face-overlay {
  position:absolute;top:-55px;left:50%;transform:translateX(-50%);
  width:50px;height:50px;object-fit:contain;
  animation:faceBounc 0.3s ease infinite alternate;
  pointer-events:none;z-index:10;
}
@keyframes faceBounc {
  from{transform:translateX(-50%) translateY(0) scale(1)}
  to{transform:translateX(-50%) translateY(-6px) scale(1.1)}
}

/* 四角守护三眼仔 */
.corner-guardian {
  position:absolute;width:44px;height:44px;object-fit:contain;
  opacity:0.75;animation:guardPulse 2.5s ease-in-out infinite;
  pointer-events:none;z-index:5;
}
@keyframes guardPulse {
  0%,100%{transform:scale(1) rotate(0deg);opacity:0.7}
  50%{transform:scale(1.12) rotate(5deg);opacity:0.95}
}

/* The Claw 台词气泡 */
.claw-bubble {
  position:fixed;z-index:502;pointer-events:none;
  background:rgba(6,17,46,0.95);border:2px solid #ffd166;
  border-radius:16px;padding:8px 16px;
  font-family:'Fredoka One',cursive;font-size:15px;color:#ffd166;
  white-space:nowrap;
  animation:bubblePop 2.5s ease forwards;
}
.claw-bubble::after {
  content:'';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:10px solid transparent;
  border-right:10px solid transparent;border-top:12px solid #ffd166;
}
@keyframes bubblePop {
  0%{transform:scale(0) translateY(20px);opacity:0}
  15%{transform:scale(1.1) translateY(0);opacity:1}
  70%{transform:scale(1) translateY(0);opacity:1}
  100%{transform:scale(0.8) translateY(-30px);opacity:0}
}

/* confetti 三眼仔版 */
.alien-confetti {
  position:fixed;z-index:450;pointer-events:none;
  animation:confettiFall linear forwards;
}
@keyframes confettiFall {
  0%{transform:translateY(-20px) rotate(0deg);opacity:1}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}
}

/* TOAST & FX */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,#0d2860,#0d1f4a);border:1px solid rgba(43,127,212,0.35);
  border-radius:24px;padding:9px 22px;font-size:14px;font-weight:700;color:var(--text);
  z-index:300;pointer-events:none;white-space:nowrap;
  animation:toastIn 0.2s ease,toastOut 0.3s 2.2s ease forwards}
@keyframes toastIn{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
@keyframes toastOut{to{transform:translateX(-50%) translateY(20px);opacity:0}}
.confetti{position:fixed;pointer-events:none;z-index:200;animation:cfFall linear forwards}
@keyframes cfFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(43,127,212,0.2);
  border-top-color:var(--blue);border-radius:50%;animation:spin 0.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:420px){.players-panel{grid-template-columns:1fr 1fr}.dice{width:52px;height:52px;font-size:28px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="(function(){var s=document.createElement('script');s.src='https://unpkg.com/@supabase/supabase-js@2';document.head.appendChild(s);})();"></script>
</head>
<body>
<canvas class="stars" id="stars"></canvas>
<div id="app">

<nav>
  <div class="logo"><img src="imgs/img_c9a3b691.png" alt="logo">    三眼仔飞行棋
  </div>
  <div class="nav-links">
    <button class="nav-btn active" onclick="showScreen('home')">主页</button>
    <button class="nav-btn" onclick="goLobby()">大厅</button>
    <button class="nav-btn" onclick="showScreen('rules')">规则</button>
  </div>
</nav>

<!-- HOME -->
<div id="screen-home" class="screen active">
  <div class="hero"><img class="hero-img" src="imgs/img_3e3220a9.png" alt="三眼仔飞行棋">    <h1>三眼仔飞行棋</h1>
    <p style="font-size:14px;color:var(--text-dim);max-width:280px">掷骰子，走棋子，吃对手，第一个到终点就赢！</p>
    <div class="hero-feats">
      <div class="feat">🎲 标准飞行棋规则</div>
      <div class="feat">👾 2-4人联机/本地</div>
      <div class="feat">🛡️ 安全格保护</div>
      <div class="feat">💥 吃子送回基地</div>
    </div>
    <div class="home-btns">
      <button class="btn-primary" onclick="openSetup('local')">本地对战 ✦</button>
      <button class="btn-ghost" onclick="openSetup('online')">联机对战</button>
    </div>
  </div>
</div>

<!-- RULES -->
<div id="screen-rules" class="screen">
  <div style="font-family:'Fredoka One',cursive;font-size:20px;color:var(--yellow)">📖 飞行棋规则</div>
  <div class="rules-card">
    <div class="rules-title">基本规则</div>
    <div class="rules-grid">

function drawBoard(state) {
  const svg = document.getElementById('ludo-board');

  let h = '';

  // 棋盘图片作为背景

      h += `<rect x="${c*C}" y="${r*C}" width="${C}" height="${C}" fill="none" stroke="rgba(255,0,0,0.4)" stroke-width="0.5"/>`;
      h += `<text x="${c*C+4}" y="${r*C+14}" font-size="8" fill="rgba(255,0,0,0.7)" font-family="sans-serif">${r},${c}</text>`;
    }
  }

  // 基地棋子槽：有玩家加入该颜色才叠加角色图片，无玩家则不叠加（保留图片原有虚线圆圈）
  {
    const BASE_SLOT_COORDS = [
      [{r:1,c:1},{r:1,c:3},{r:3,c:1},{r:3,c:3}],
      [{r:1,c:11},{r:1,c:13},{r:3,c:11},{r:3,c:13}],
      [{r:11,c:1},{r:11,c:3},{r:13,c:1},{r:13,c:3}],
      [{r:11,c:11},{r:11,c:13},{r:13,c:11},{r:13,c:13}],
    ];
    const pd = JSON.parse(localStorage.getItem('ludo_players')||'[]');
    BASE_SLOT_COORDS.forEach((slots, pi) => {
      const playerData = pd[pi];
      const avatarSrc = playerData ? playerData.src : '';
      if (!avatarSrc) return;
      slots.forEach((slot, si) => {
        const cx = slot.c * 40 + 20;
        const cy = slot.r * 40 + 20;
        const clipId = 'bclip_' + pi + '_' + si;
        const piecesInBase = state ? state.pieces.filter(pc => pc.player === pi && pc.pos === -1) : [];
        const piece = piecesInBase[si];
        if (piece) {
          h += `<defs><clipPath id="${clipId}"><circle cx="${cx}" cy="${cy}" r="17"/></clipPath></defs>`;
          h += `<image href="${avatarSrc}" x="${cx-17}" y="${cy-17}" width="34" height="34" clip-path="url(#${clipId})"/>`;
        }
      });
    });
  }
  // 棋子坐标系：基于图片实际布局
  // 图片约 15x15 格，每格约 40px（600/15）
  const C = 40;
  const PC = ['#e53935','#ffb300','#1e88e5','#43a047'];

  // 外圈路径坐标（与 LUDO_OUTER 对应，row/col * C + C/2 = 中心）
  // 基地棋子槽位置
  const BASE_SLOTS = [
    [[1,1],[1,3],[3,1],[3,3]], // 红 左上
    [[1,11],[1,13],[3,11],[3,13]], // 黄 右上
    [[11,1],[11,3],[13,1],[13,3]], // 绿 左下
    [[11,11],[11,13],[13,11],[13,13]], // 蓝 右下
  ];

  if(state) {
    const posMap = {};
    state.pieces.forEach(pc => {
      if(!pc.finished && pc.pos >= 0 && pc.pos < LUDO_OUTER.length) {
        if(!posMap[pc.pos]) posMap[pc.pos] = [];
        posMap[pc.pos].push(pc);
      }
    });

    state.pieces.forEach(pc => {
      if(pc.finished) {
        // 到达终点，显示在中央风车区域
        const cx = (7 + (pc.idx%2)*0.6 - 0.3) * C;
        const cy = (7 + Math.floor(pc.idx/2)*0.6 - 0.3 + pc.player*0.15) * C;
        h += drawPiece(cx, cy, pc, state);
        return;
      }
      if(pc.pos === -1) {
        // 在基地
        const [dr, dc] = BASE_SLOTS[pc.player][pc.idx];
        h += drawPiece(dc * C + C/2, dr * C + C/2, pc, state);
      } else if(pc.pos >= 0 && pc.pos < LUDO_OUTER.length) {
        const {r, c} = LUDO_OUTER[pc.pos];
        const stack = posMap[pc.pos] || [pc];
        const si = stack.indexOf(pc);
        let ox = 0, oy = 0;
        if(stack.length === 2) {
          const offs2 = [-14, 14];
          ox = offs2[si] || 0;
        } else if(stack.length === 3) {
          const offs3 = [[-14,-8],[14,-8],[0,12]];
          ox = offs3[si] ? offs3[si][0] : 0;
          oy = offs3[si] ? offs3[si][1] : 0;
        } else if(stack.length >= 4) {
          const offs4 = [[-10,-10],[10,-10],[-10,10],[10,10]];
          ox = offs4[si] ? offs4[si][0] : 0;
          oy = offs4[si] ? offs4[si][1] : 0;
        }
        h += drawPieceAvatar((c + 0.5)*C + ox, (r + 0.5)*C + oy, pc, state);
      } else if(pc.pos === -2 && pc.homePos >= 0) {
        const lane = HOME_DISPLAY[pc.player];
        const cell = lane && lane[Math.min(pc.homePos, lane.length-1)];
        if(cell) h += drawPiece((cell.c+0.5)*C, (cell.r+0.5)*C, pc, state);
      }
    });
  }

  svg.innerHTML = h;
  svg.onclick = e => {
    const g = e.target.closest('[data-pc]');
    if(g) {
      const [pi,ki] = g.dataset.pc.split(',').map(Number);
      handlePieceClick(pi, ki);
    }
  };
}

function drawPieceAvatar(cx, cy, pc, state) {
  const PC = ['#e53935','#ffb300','#1e88e5','#43a047'];
  const col = PC[pc.player];
  const C = 40, r = 16;
  const isTurn = state && state.currentPlayer === pc.player && state.phase === 'move';
  const movable = isTurn && canMove(pc, state.diceVal, state);
  const filter = movable ? 'filter="url(#pglow)"' : '';
  const clipId = 'pclip_' + pc.player + '_' + pc.idx;
  const pd = JSON.parse(localStorage.getItem('ludo_players')||'[]');
  const playerData = pd[pc.player];
  const avatarSrc = playerData ? playerData.src : '';
  const nick = playerData ? (playerData.name || '') : '';
  const pulse = movable ? '<animate attributeName="r" values="' + r + ';' + (r*1.25) + ';' + r + '" dur="0.7s" repeatCount="indefinite"/>' : '';
  let inner = '';
  if (avatarSrc) {
    inner += '<defs><clipPath id="' + clipId + '"><circle cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (pulse ? '>' + pulse + '</circle>' : '/>') + '</clipPath></defs>';
    inner += '<image href="' + avatarSrc + '" x="' + (cx-r) + '" y="' + (cy-r) + '" width="' + (r*2) + '" height="' + (r*2) + '" clip-path="url(#' + clipId + ')" ' + filter + '/>';
    inner += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="2.5"/>';
  } else {
    inner += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + col + '" stroke="white" stroke-width="2.5" opacity="0.92" ' + filter + '>' + pulse + '</circle>';
    inner += '<text x="' + cx + '" y="' + (cy + r*0.4) + '" text-anchor="middle" font-size="' + (r*1.1) + '" font-weight="900" fill="white" font-family="sans-serif">' + (pc.idx+1) + '</text>';
  }
  if (nick) {
    inner += '<text x="' + cx + '" y="' + (cy + r + 10) + '" text-anchor="middle" font-size="10" font-weight="900" fill="#fff" font-family="sans-serif" style="paint-order:stroke fill;stroke:#000;stroke-width:3px;fill:#fff;font-size:10px;text-anchor:middle">' + nick + '</text>';
  }
  return '<g data-pc="' + pc.player + ',' + pc.idx + '" style="cursor:' + (movable?'pointer':'default') + '">' + inner + '</g>';
}

function drawPiece(cx, cy, pc, state) {
  const PC = ['#e53935','#ffb300','#1e88e5','#43a047'];
  const col = PC[pc.player];
  const C = 40, r = C * 0.3;
  const isTurn = state && state.currentPlayer === pc.player && state.phase === 'move';
  const movable = isTurn && canMove(pc, state.diceVal, state);
  const pulse = movable ? `<animate attributeName="r" values="${r};${r*1.3};${r}" dur="0.7s" repeatCount="indefinite"/>` : '';
  const filter = movable ? `filter="url(#pglow)"` : '';
  return `<g data-pc="${pc.player},${pc.idx}" style="cursor:${movable?'pointer':'default'}">
    <defs><filter id="pglow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="${col}" stroke="white" stroke-width="2.5" opacity="0.92" ${filter}>${pulse}</circle>
    <text x="${cx}" y="${cy+r*0.4}" text-anchor="middle" font-size="${r*1.1}" font-weight="900" fill="white" font-family="sans-serif">${pc.idx+1}</text>
  </g>`;
}

function newGame(np) {
  const pieces = [];
  for(let p=0;p<np;p++) for(let k=0;k<4;k++) {
    pieces.push({player:p, idx:k, pos:-1, finished:false, homePos:-1});
  }
  return {players:np, currentPlayer:0, pieces, diceVal:null, phase:'roll', winner:null, log:[]};
}

function canMove(pc, dice, state) {
  if(!dice || pc.finished) return false;
  if(pc.pos === -1) return dice === 6;
  const np = nextPos(pc, dice);
  return np !== null;
}

function isUnderThreat(pc, state) {
  if(pc.pos<0||pc.finished||SAFE_IDX.includes(pc.pos)) return false;
  for(const other of state.pieces){
    if(other.player===pc.player||other.pos<0||other.finished) continue;
    for(let d=1;d<=3;d++){
      const res=nextPos(other,d);
      if(res&&!res.home&&res.pos===pc.pos) return true;
    }
  }
  return false;
}

function nextPos(pc, dice) {
  if(pc.pos === -1) {
    return dice === 6 ? {pos:P_START[pc.player], home:false, homePos:-1} : null;
  }
  // 计算在外圈的相对位置
  const start = P_START[pc.player];
  const homeEntry = P_HOME_ENTRY[pc.player];
  const rel = (pc.pos - start + 52) % 52;
  const heRel = (homeEntry - start + 52) % 52;
  const newRel = rel + dice;

  if(newRel > heRel + 1) {
    // 进入终点道
    const hp = newRel - heRel - 2;
    if(hp > 4) return null; // 超出终点
    if(hp === 4) return {pos:-2, home:true, homePos:5, finished:true}; // 到达终点
    return {pos:-2, home:true, homePos:hp};
  }
  return {pos:(start + newRel%52)%52, home:false, homePos:-1};
}

async function doMove(pi, ki) {
  if(!gs || gs.phase!=='move' || gs.currentPlayer!==pi) return;
  const pc = gs.pieces.find(p=>p.player===pi&&p.idx===ki);
  if(!pc || !canMove(pc, gs.diceVal, gs)) return;

  const result = nextPos(pc, gs.diceVal);
  if(!result) return;

  sndMove();

  if(result.home) {
    pc.homePos = result.homePos;
    pc.pos = -2;
    if(result.finished) {
      pc.finished = true;
      log(`${P_NAMES[pi]} 棋子${ki+1} 到达终点！🏆`);
      const myPcs = gs.pieces.filter(p=>p.player===pi);
      if(myPcs.every(p=>p.finished)) { endGame(pi); return; }
    } else {
      log(`${P_NAMES[pi]} 棋子${ki+1} 进入终点跑道第${result.homePos+1}格`);
    }
  } else {
    pc.pos = result.pos;
    log(`${P_NAMES[pi]} 掷了 ${gs.diceVal}，棋子${ki+1} 前进`);
    // 棋子跳跃动画
    if(pc.pos < DISPLAY_PATH.length) {
      const {r,c} = DISPLAY_PATH[pc.pos];
      animatePieceJump((c+0.5)*40, (r+0.5)*40);
    }
    // 吃子
    gs.pieces.forEach(other => {
      if(other.player===pi||other.pos!==pc.pos||other.finished||other.pos===-1) return;
      const safe = SAFE_IDX.includes(pc.pos);
      if(!safe) {
        // 吃子特效
        if(other.pos < DISPLAY_PATH.length) {
          const {r,c} = DISPLAY_PATH[other.pos];
          const sc = boardToScreen(r,c);
          alienEatEffect(sc.x, sc.y);
        }
        other.pos = -1; other.homePos = -1;
        sndEat(); showEatPopup();
        log(`${P_NAMES[pi]} 吃掉了 ${P_NAMES[other.player]} 的棋子！💥 送回基地`);
      } else {
        // 安全格特效
        if(pc.pos < DISPLAY_PATH.length) {
          const {r,c} = DISPLAY_PATH[pc.pos];
          const sc = boardToScreen(r,c);
          safeZoneEffect(sc.x, sc.y);
        }
        sndSafe();
        log(`安全格保护！无法吃子 🛡️`);
      }
    });
  }

  gs.diceVal = null;
  if(gs.extraRoll) {
    gs.phase='roll'; gs.extraRoll=false;
  } else {
    gs.currentPlayer = (gs.currentPlayer+1)%numPlayers;
    gs.phase='roll';
  }

  // 联机广播移动动作
  if(gameMode==='online' && sb && currentRoomId){
    await sb.from('ludo_actions').insert({
      room_id: currentRoomId, player_id: myPlayerId,
      action_type: 'move', piece_idx: ki,
      game_state: gs
    });
    // 同步房间游戏状态
    await sb.from('ludo_rooms').update({game_state:gs}).eq('id',currentRoomId);
  }

  drawBoard(gs); updateUI();
}

function endGame(winner) {
  gs.winner=winner; gs.phase='end';
  sndWin();
  const pd = JSON.parse(localStorage.getItem('ludo_players')||'[]');
  const w = pd[winner]||{name:P_NAMES[winner],src:ALIENS[winner%ALIENS.length]?.src||ALIENS[0].src};
  
  // 三眼仔胜利特效（从天而降 + 灯光 + 彩屑）
  alienVictoryEffect(w.src);
  
  // 延迟显示结算画面
  setTimeout(() => {
    document.getElementById('end-winner-img').innerHTML = `<img src="${w.src}" style="width:90px;height:90px;object-fit:contain;animation:bob 1.5s ease-in-out infinite">`;
    document.getElementById('end-title').textContent = `🏆 ${w.name} 胜利！`;
    document.getElementById('end-msg').textContent = `恭喜率先将4颗棋子全部送达终点！The Claw chooses you！`;
    document.getElementById('end-overlay').classList.remove('hidden');
  }, 1200);
}

// ============================================================
// DICE
// ============================================================
const DICE_F = ['','⚀','⚁','⚂','⚃','⚄','⚅'];

function rollDice() {
  if(!gs||gs.phase!=='roll') return;
  if(gameMode==='online'&&Number(gs.currentPlayer)!==Number(myPlayerIdx)) return;
  console.log('[rollDice] myPlayerIdx:', myPlayerIdx, 'gs.currentPlayer:', gs.currentPlayer);
  const el = document.getElementById('dice-face');
  el.classList.add('rolling','disabled');
  sndDice();
  showDiceFace(true); // 显示骰子三眼仔表情
  let n=0;
  const t=setInterval(()=>{
    el.textContent=DICE_F[Math.floor(Math.random()*6)+1];
    if(++n>=10) {
      clearInterval(t);
      el.classList.remove('rolling','disabled');
      const v=Math.floor(Math.random()*6)+1;
      el.textContent=DICE_F[v];
      gs.diceVal=v;
      document.getElementById('dice-result').textContent=`掷到了 ${v} 点`;
      showDiceFace(false);
      alienCheer(v); // 三眼仔欢呼特效
      onRolled(v);
    }
  },55);
}

async function onRolled(v) {
  const cur=gs.currentPlayer;
  const myPcs=gs.pieces.filter(p=>p.player===cur&&!p.finished);
  const movable=myPcs.filter(pc=>canMove(pc,v,gs));

  if(v===6) { gs.extraRoll=true; }

  // Helper: broadcast a deep-copy snapshot of gs
  async function broadcastRoll() {
    if(gameMode==='online' && sb && currentRoomId){
      const snap = JSON.parse(JSON.stringify(gs));
      console.log('[broadcastRoll] currentPlayer:', snap.currentPlayer, 'phase:', snap.phase);
      const {error} = await sb.from('ludo_actions').insert({
        room_id:currentRoomId, player_id:myPlayerId,
        action_type:'roll', dice_val:v, game_state:snap
      });
      if(error) console.error('[broadcastRoll] insert error:', error.message);
    }
  }

  if(movable.length===0) {
    log(`${P_NAMES[cur]} 掷了 ${v}，无子可动`);
    document.getElementById('move-hint').textContent='😅 没有可动的棋子，自动跳过';
    // Wait for the skip animation, then update state and broadcast
    await new Promise(r=>setTimeout(r,900));
    if(v===6) { gs.phase='roll'; gs.diceVal=null; gs.extraRoll=false; }
    else { gs.currentPlayer=(gs.currentPlayer+1)%numPlayers; gs.phase='roll'; gs.diceVal=null; }
    drawBoard(gs); updateUI();
    await broadcastRoll();
    return;
  }

  if(movable.length===1&&movable[0].pos===-1&&v===6) {
    gs.phase='move';
    document.getElementById('move-hint').textContent='棋子自动出基地！';
    await broadcastRoll();
    setTimeout(()=>doMove(cur, movable[0].idx), 400);
    return;
  }

  gs.phase='move';
  document.getElementById('move-hint').textContent='点击你的棋子移动';
  await broadcastRoll();
  drawBoard(gs); updateUI();
}

function handlePieceClick(pi,ki) {
  if(!gs||gs.phase!=='move'||Number(gs.currentPlayer)!==Number(pi)) return;
  if(gameMode==='online'&&Number(pi)!==Number(myPlayerIdx)) return;
  doMove(pi,ki);
}

function updateUI() {
  if(!gs) return;
  const cur = Number(gs.currentPlayer);           // coerce — JSONB can return strings
  const myIdx = Number(myPlayerIdx);
  const isMyTurn = (gameMode === 'local') || (cur === myIdx);
  console.log('[updateUI] myIdx:', myIdx, 'currentPlayer:', cur, 'isMyTurn:', isMyTurn, 'phase:', gs.phase, 'mode:', gameMode);

  document.getElementById('turn-info').textContent=`${P_NAMES[cur]} 的回合`;
  document.getElementById('turn-info').style.color=P_COLORS[cur];

  const TURN_EMOJIS = ['🔴','🟡','🔵','🟢'];
  const TURN_COLORS = ['#e53935','#ffb300','#1e88e5','#43a047'];
  const banner=document.getElementById('turn-banner');
  if(gameMode==='online'){
    if(isMyTurn && gs.phase==='roll'){
      banner.innerHTML = '<span style="color:' + TURN_COLORS[cur] + '">' + TURN_EMOJIS[cur] + ' ' + COLOR_NAMES[cur] + '方掷骰子</span>';
      banner.style.color=TURN_COLORS[cur];
      banner.classList.add('banner-pulse');
    } else if(isMyTurn && gs.phase==='move'){
      banner.innerHTML = '<span style="color:' + TURN_COLORS[cur] + '">🎯 选一颗棋子移动</span>';
      banner.style.color=TURN_COLORS[cur];
      banner.classList.remove('banner-pulse');
    } else {
      banner.innerHTML = '⏳ 等待对方操作...';
      banner.style.color='var(--text-dim)';
      banner.classList.remove('banner-pulse');
    }
  } else {
    banner.innerHTML = gs.phase==='roll' ? '<span style="color:' + TURN_COLORS[cur] + '">' + TURN_EMOJIS[cur] + ' ' + COLOR_NAMES[cur] + '方掷骰子</span>' : '<span style="color:' + TURN_COLORS[cur] + '">🎯 ' + COLOR_NAMES[cur] + '方选棋子移动</span>';
    banner.style.color=TURN_COLORS[cur];
    banner.classList.remove('banner-pulse');
  }

  const dice=document.getElementById('dice-face');
  const canRoll = isMyTurn && gs.phase==='roll';
  dice.classList.toggle('disabled', !canRoll);
  dice.classList.toggle('my-turn', canRoll);
  if(gs.phase==='roll') dice.textContent='🎲';

  const mh=document.getElementById('move-hint');
  if(mh){
    if(gs.phase==='roll'){
      if(isMyTurn){ mh.textContent='👆 现在轮到你！点击骰子'; mh.style.color=P_COLORS[cur]; }
      else { mh.textContent='⏳ 等待对方操作...'; mh.style.color='var(--text-dim)'; }
    } else if(gs.phase==='move'){
      if(isMyTurn){
        const myPcs=gs.pieces.filter(p=>Number(p.player)===cur&&canMove(p,gs.diceVal,gs));
        const hasInBase=myPcs.some(p=>p.pos===-1);
        if(gs.diceVal===6&&hasInBase){
          mh.textContent='🎉 掷到6！点击基地里的棋子出发'; mh.style.color='#ffd166';
        } else {
          const canCapture=myPcs.some(p=>{
            if(p.pos<0) return false;
            const res=nextPos(p,gs.diceVal);
            return res&&!res.home&&gs.pieces.some(o=>Number(o.player)!==cur&&o.pos===res.pos&&!o.finished&&!SAFE_IDX.includes(res.pos));
          });
          if(canCapture){ mh.textContent='⚠️ 可以吃掉对方棋子！'; mh.style.color='#ff9f43'; }
          else { mh.textContent='👆 点击你的棋子移动'; mh.style.color='#06d6a0'; }
        }
      } else {
        mh.textContent='⏳ 等待对方操作...'; mh.style.color='var(--text-dim)';
      }
    }
  }
  renderPanel();
}

function renderPanel() {
  if(!gs) return;
  const pd=JSON.parse(localStorage.getItem('ludo_players')||'[]');
  document.getElementById('players-panel').innerHTML=Array.from({length:numPlayers},(_,i)=>{
    const p=pd[i]||{name:P_NAMES[i],src:ALIENS[i%ALIENS.length]?.src||ALIENS[0].src};
    const pcs=gs.pieces.filter(pc=>pc.player===i);
    const fin=pcs.filter(pc=>pc.finished).length;
    const out=pcs.filter(pc=>pc.pos>=0&&!pc.finished).length;
    const base=pcs.filter(pc=>pc.pos===-1).length;
    const isMe=gameMode==='local'?true:i===myPlayerIdx;
    const isCur=gs.currentPlayer===i;
    return `<div class="player-card" style="border-color:${isCur?P_COLORS[i]:'rgba(255,255,255,0.08)'};box-shadow:${isCur?`0 0 12px ${P_COLORS[i]}50`:''}">
      <img src="${p.src}" style="width:34px;height:34px;object-fit:contain">
      <div style="flex:1;min-width:0">
        <div class="player-name" style="color:${P_COLORS[i]};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</div>
        <div class="player-status">🏠${base} 🎮${out} 🏆${fin}</div>
      </div>
      <div class="pieces-row">${pcs.map(pc=>`<div class="piece-mini" style="background:${pc.finished?'#ffd166':P_COLORS[i]};opacity:${pc.pos===-1?.3:1}"></div>`).join('')}</div>
    </div>`;
  }).join('');
}

function log(msg) {
  if(!gs) return;
  gs.log=[msg,...(gs.log||[])].slice(0,10);
}

async function joinByCode(){

async function loadRooms(){
  const g=document.getElementById('rooms-grid');
  g.innerHTML='<div style="text-align:center;padding:2rem;color:var(--text-dim)">扫描中... <span class="spinner"></span></div>';
  if(!sb){g.innerHTML=demoRooms();return;}
  const {data,error}=await sb.from('ludo_rooms').select('*,ludo_players(id)').eq('status','waiting').order('created_at',{ascending:false}).limit(20);
  if(error||!data){g.innerHTML=demoRooms();return;}
  // Auto-delete orphaned rooms (host left without cleaning up)
  const orphans=data.filter(r=>!r.ludo_players||r.ludo_players.length===0);
  orphans.forEach(r=>sb.from('ludo_rooms').delete().eq('id',r.id).then(()=>{}));
  const live=data.filter(r=>r.ludo_players&&r.ludo_players.length>0);
  const createCard='<div class="create-card" onclick="openCreateRoom()">＋ 创建新房间</div>';
  if(!live.length){g.innerHTML='<div style="text-align:center;padding:2rem;color:var(--text-dim)">暂无房间</div>'+createCard;return;}
  const cards=live.map(r=>{
    const mine=r.host_id===myPlayerId;
    const delBtn=mine?`<button class="room-del-btn" onclick="event.stopPropagation();deleteRoom('${r.id}')" title="删除房间">✕</button>`:'';
    return `<div class="room-card" onclick="joinOnlineRoom('${r.id}')">
      ${delBtn}
      <div class="room-card-head"><span class="room-name">${esc(r.name)}</span><span class="badge">等待中</span></div>
      <div class="room-meta">${r.max_players}人对战 · ${r.ludo_players.length}人已加入</div>
    </div>`;
  }).join('');
  g.innerHTML=cards+createCard;
}
async function deleteRoom(rid){
  if(!sb){toast('Supabase未连接');return;}
  const {error:e1}=await sb.from('ludo_players').delete().eq('room_id',rid);
  if(e1){toast('删除失败：'+e1.message);return;}
  const {error:e2}=await sb.from('ludo_rooms').delete().eq('id',rid);
  if(e2){toast('删除失败：'+e2.message);return;}
  toast('房间已删除');
  loadRooms();
}

async function createRoom(){
  if(!sb){ toast('Supabase未连接'); return; }
  closeCreateRoom();
  const name = document.getElementById('room-name-input').value.trim() || '新棋局';
  const maxP = parseInt(document.getElementById('room-players').value);
  const rid = Math.random().toString(36).slice(2,10);
  const {error} = await sb.from('ludo_rooms').insert({
    id:rid, name, host_id:myPlayerId,
    status:'waiting', max_players:maxP,
    current_player:0, game_state:null
  });
  if(error){ toast('创建失败：'+error.message); return; }

  await joinOnlineRoom(rid);
}

async function joinOnlineRoom(rid){
  if(!sb){ toast('Supabase未连接'); return; }
  if(!myNick){ openSetup('online'); return; }
  const {data:room, error} = await sb.from('ludo_rooms').select('*,ludo_players(*)').eq('id',rid).single();
  if(error||!room){ toast('房间不存在'); return; }
  if(room.status!=='waiting'){ toast('游戏已开始，无法加入'); return; }
  const players = room.ludo_players||[];
  if(players.length >= room.max_players){ toast('房间已满！'); return; }
  const existing = players.find(p=>p.id===myPlayerId);
  const playerIdx = existing ? existing.player_idx : players.length;
  const colorIdx  = existing ? existing.color_idx  : (myColorIdx >= 0 ? myColorIdx : playerIdx);
  if(!existing){
    const {error:pe} = await sb.from('ludo_players').upsert({
      id:myPlayerId, room_id:rid,
      nickname:myNick, avatar_id:myAvatarId,
      color_idx:colorIdx, player_idx:colorIdx, is_ready:false
    },{onConflict:'id'});
    if(pe){ toast('加入失败：'+pe.message); return; }
  }
  // Re-fetch confirmed color_idx from DB to handle race conditions
  const {data:myRec} = await sb.from('ludo_players').select('player_idx,color_idx').eq('id',myPlayerId).eq('room_id',rid).single();
  const confirmedIdx = (myRec && myRec.color_idx != null) ? myRec.color_idx : (myRec && myRec.player_idx != null ? myRec.player_idx : playerIdx);
  currentRoomId=rid; myPlayerIdx=confirmedIdx; gameMode='online';
  localStorage.setItem('ludo_pidx_'+rid, String(confirmedIdx));
  console.log('[join] myPlayerIdx:', confirmedIdx, 'myPlayerId:', myPlayerId.slice(-6));
  showScreen('game');
  document.getElementById('room-code-bar').style.display='flex';
  document.getElementById('room-code-val').textContent=rid.toUpperCase();
  document.getElementById('board-wrap').style.display='none';
  // Restore player index from localStorage if available (page refresh scenario)
  const savedIdx = localStorage.getItem('ludo_pidx_'+rid);
  if(savedIdx !== null) myPlayerIdx = parseInt(savedIdx);
  if(room.game_state){
    gs=room.game_state; numPlayers=room.max_players;
    document.getElementById('board-wrap').style.display='flex';
    drawBoard(gs); updateUI(); initGuardians();
    log('重新连接游戏中...');
  } else {
    const fresh = await sb.from('ludo_rooms').select('*,ludo_players(*)').eq('id',rid).single();
    showWaitingRoom(fresh.data||room);
  }
  subscribeRoom(rid);
}

  numPlayers = room.max_players;
  isHost = room.host_id===myPlayerId;
  document.getElementById('board-wrap').style.display='none';

          width:72px;padding:8px;border-radius:12px;
          border:2px solid ${p?P_COLORS[i]:'rgba(255,255,255,0.1)'};

              border-radius:50%;display:flex;align-items:center;justify-content:center;
              font-size:20px;color:rgba(255,255,255,0.2)">?</div>
              <div style="font-size:10px;color:rgba(255,255,255,0.3)">等待中</div>`}
        </div>`;
      }).join('')}
    </div>
    <div style="font-size:13px;color:var(--text-dim);text-align:center">${players.length}/${room.max_players} 人已加入</div>
    ${isHost&&players.length>=2

      :`<div style="font-size:12px;color:var(--text-dim);text-align:center">等待房主开始游戏...</div>`}
  `;
  renderPanel();

function createWaitDiv(){
  const d=document.createElement('div');
  d.id='online-wait';
  d.style.cssText='display:flex;flex-direction:column;gap:1rem;align-items:center;'+
    'background:rgba(6,17,46,0.8);border:1px solid rgba(43,127,212,0.2);'+

async function hostStartGame(){
  if(!sb||!currentRoomId) return;
  const {data:players} = await sb.from('ludo_players').select('*').eq('room_id',currentRoomId).order('player_idx');
  if(!players||players.length<2){ toast('至少需要2人！'); return; }
  numPlayers=players.length;
  gs=newGame(numPlayers);
  const pd=players.map(p=>({
    name:p.nickname,
    src:(ALIENS.find(a=>a.id===p.avatar_id)||ALIENS[0]).src,
    id:p.id
  }));
  localStorage.setItem('ludo_players',JSON.stringify(pd));
  const {error} = await sb.from('ludo_rooms').update({status:'playing',game_state:gs}).eq('id',currentRoomId);
  if(error){ toast('开始失败：'+error.message); return; }
  // Show board immediately for host (don't rely solely on realtime)
  const waitDiv=document.getElementById('online-wait');
  if(waitDiv) waitDiv.style.display='none';
  const bw=document.getElementById('board-wrap');
  if(bw) bw.style.display='flex';
  drawBoard(gs); updateUI(); initGuardians();
  await sb.from('ludo_actions').insert({
    room_id:currentRoomId, player_id:myPlayerId,
    action_type:'start', game_state:gs
  });
}

function subscribeRoom(rid){
  if(rtChannel&&sb) sb.removeChannel(rtChannel);
  if(!sb) return;
  rtChannel = sb.channel('ludo:'+rid)
    .on('postgres_changes',{event:'*',schema:'public',table:'ludo_players',filter:'room_id=eq.'+rid},async()=>{
      const {data:room} = await sb.from('ludo_rooms').select('*,ludo_players(*)').eq('id',rid).single();
      if(room&&room.status==='waiting') showWaitingRoom(room);
      renderPanel();
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'ludo_actions',filter:'room_id=eq.'+rid},pl=>{
      if(pl.new.player_id===myPlayerId) return;
      handleRemoteAction(pl.new);
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'ludo_rooms',filter:'id=eq.'+rid},pl=>{
      const room=pl.new;
      if(room.status==='playing'){
        const waitDiv=document.getElementById('online-wait');
        if(waitDiv) waitDiv.style.display='none';
        const bw=document.getElementById('board-wrap');
        if(bw) bw.style.display='flex';
        if(room.game_state){
          gs=room.game_state; numPlayers=gs.players;
          sb.from('ludo_players').select('*').eq('room_id',rid).order('player_idx').then(({data})=>{
            if(data){
              const pd=data.map(p=>({
                name:p.nickname,
                src:(ALIENS.find(a=>a.id===p.avatar_id)||ALIENS[0]).src,
                id:p.id
              }));
              localStorage.setItem('ludo_players',JSON.stringify(pd));
            }
            drawBoard(gs); updateUI(); initGuardians();
            log('游戏开始！掷到6才能出基地 🎲');
          });
        }
      }
    })
    .subscribe((status,err)=>{
      console.log('🔌 realtime status:', status, err||'');
      if(status==='SUBSCRIBED') console.log('✅ Room subscribed:', rid);
      if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){
        console.error('❌ Channel error, retrying in 3s:', err);
        setTimeout(()=>{ if(currentRoomId===rid) subscribeRoom(rid); }, 3000);
      }
    });
}

function handleRemoteAction(action){
  console.log('[remote]', action.action_type, 'from:', action.player_id?.slice(-6), 'has_gs:', !!action.game_state);
  if(action.action_type==='start'){
    if(!action.game_state) return;
    gs=action.game_state; numPlayers=Number(gs.players);
    const waitDiv=document.getElementById('online-wait');
    if(waitDiv) waitDiv.style.display='none';
    const bw=document.getElementById('board-wrap');
    if(bw) bw.style.display='flex';
    console.log('[handleRemoteAction start] myPlayerIdx:', myPlayerIdx, 'gs.currentPlayer:', gs.currentPlayer);
    drawBoard(gs); updateUI(); initGuardians();
    return;
  }
  if(!action.game_state) return;
  if(action.action_type==='roll'||action.action_type==='move'){
    const prev = gs ? Number(gs.currentPlayer) : 0;
    gs=action.game_state; numPlayers=Number(gs.players);
    if(action.action_type==='roll'){
      const el=document.getElementById('dice-face');
      if(el) el.textContent=['','⚀','⚁','⚂','⚃','⚄','⚅'][action.dice_val]||'🎲';
      const dr=document.getElementById('dice-result');
      if(dr) dr.textContent=P_NAMES[prev]+' 掷了 '+action.dice_val+' 点';
      sndDice();
    }
    if(action.action_type==='move') sndMove();
    console.log('[handleRemoteAction '+action.action_type+'] myPlayerIdx:', myPlayerIdx, 'gs.currentPlayer:', gs.currentPlayer);
    drawBoard(gs); updateUI();
  }
}

async function leaveGame(){
  if(rtChannel && sb){ sb.removeChannel(rtChannel); rtChannel=null; }
  // Capture state before resetting
  const rid = currentRoomId;
  const wasHost = isHost;
  const wasOnline = gameMode === 'online';
  gs=null; gameMode='local'; isHost=false; currentRoomId=null;
  if(wasOnline && sb && rid){
    if(wasHost){
      const {error:e1} = await sb.from('ludo_players').delete().eq('room_id',rid);
      if(e1) console.error('delete players failed:', e1.message);
      const {error:e2} = await sb.from('ludo_rooms').delete().eq('id',rid);
      if(e2) console.error('delete room failed:', e2.message);
    } else {
      const {error:e3} = await sb.from('ludo_players').delete().eq('id',myPlayerId).eq('room_id',rid);
      if(e3) console.error('delete player failed:', e3.message);
    }
  }
  const waitDiv=document.getElementById('online-wait');
  if(waitDiv) waitDiv.style.display='none';
  document.getElementById('end-overlay').classList.add('hidden');
  const bw=document.getElementById('board-wrap');
  if(bw) bw.style.display='flex';
  showScreen('home');
}
function restartGame(){document.getElementById('end-overlay').classList.add('hidden');if(gameMode==='local')startLocal(numPlayers);}
function copyCode(){
  if(!currentRoomId){ toast('请先加入房间'); return; }
  const url = location.href.split('?')[0] + '?room=' + currentRoomId;
  navigator.clipboard.writeText(url).then(()=>toast('👾 邀请链接已复制！分享给朋友！'));
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id)?.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach((b,i)=>b.classList.toggle('active',['home','lobby','rules'][i]===id));
}
function showToast(msg){toast(msg);}
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2700);
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
